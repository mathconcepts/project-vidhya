<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Display and titles</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

<div class="col" style="gap:10px">
  <div style="font-size:48px;font-weight:700;letter-spacing:-.022em;line-height:1.05">Compounding</div>
  <div style="font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.1">Linear Algebra</div>
  <div style="font-size:28px;font-weight:600;letter-spacing:-.018em">Exam readiness</div>
  <div style="font-size:22px;font-weight:600;letter-spacing:-.018em">Today's plan</div>
  <div style="font-size:20px;font-weight:600;letter-spacing:-.018em">Your notes</div>
</div>
<p class="lbl" style="margin-top:12px">48 / 34 / 28 / 22 / 20 — system sans, semibold or bold, negative tracking.</p>
</body></html>
