# Opted into the stance rollout. This is the top-level signal the
# content-maturity report reads; the per-atom-type `stances:` guidance below
# is authoring instruction and deliberately cannot double as it (every
# template carries that guidance, so it would opt every topic in at once).
#
# Opted in because the topic is genuinely finished: all 6 of its concepts
# carry a shaken and an assured body for every narrative atom type they have.
stances:
  rollout: authored
  variants: [shaken, assured]

topic_family: complex-variables

intuition:
  scaffold: rotation-in-plane
  guidance: |
    Lead with i as a 90° rotation operator. Argand plane = R^2 with
    multiplication = rotation+scale. Avoid algebraic manipulation first.
  bloom_floor: 2

  stances:
    shaken: |
      Multiply one specific complex number by i and watch it land 90 degrees
      around on the Argand plane before any algebra — the rotation should be
      seen as a picture, not deduced from i^2 = -1.
    assured: |
      Skip straight to where a sign or a quadrant is lost — the argument of
      a complex number is not just arctan(b/a); the quadrant has to come
      from the picture, and that is the actual trap in this topic.

formal_definition:
  scaffold: cartesian-and-polar
  guidance: |
    Define z = a + bi AND z = r e^{iθ} side by side. Conversion formulas
    in display math.
  bloom_floor: 3

worked_example:
  scaffold: step-unfold
  guidance: |
    Convert form → operate (add/multiply/conjugate) → convert back.
    Six steps max.
  bloom_floor: 3

  stances:
    shaken: |
      Keep the three moves — convert, operate, convert back — as three
      distinct lines with nothing folded together. Write the i^2 = -1
      substitution as its own visible line rather than absorbing it
      silently, and make the modulus check explicit at the end.
    assured: |
      If the operation is multiplication or division, work in polar form
      directly and skip the Cartesian expansion entirely — say why polar is
      faster here. Flag the quadrant of the argument explicitly rather than
      reading it off arctan alone.

common_traps:
  scaffold: wrong-then-right
  guidance: |
    Common: forgetting i^2 = -1 mid-computation, wrong arg quadrant,
    confusing modulus with magnitude squared.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  bloom_floor: 2

visual_analogy:
  scaffold: argand-plane
  guidance: |
    Embed an interactive showing complex multiplication as rotation.

    When the concept reduces to a 2D parametric plot (z(t) on the Argand
    plane, modulus growth, phase rotation), ALSO emit a fenced gif-scene
    block at the end of the body. Schema:

    ```gif-scene
    {"type":"parametric","expression":"cos(t)","x_range":[-1.5,1.5],"y_range":[-1.5,1.5],"t_range":[0,6.28],"frames":30,"fps":12}
    ```

    Allowed tokens: x, t, +, -, *, /, ^, parens, numbers, sin/cos/tan/log/
    ln/exp/sqrt/abs/pi/e. OMIT the block when the concept is symbolic-only
    (algebraic identities, polynomial roots without trajectory). Never
    invent a misleading scene.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  bloom_floor: 4

hook:
  scaffold: rotation-question
  bloom_floor: 1
  stances:
    shaken: |
      One number, one multiplication by i, and the single rotation it
      produces — nothing about the plane in general yet.
    assured: |
      Name the one place a correct modulus and a correct argument still
      combine into a wrong quadrant.
