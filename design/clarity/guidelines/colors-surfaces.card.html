<!-- @dsCard group="Colors" viewport="700x180" subtitle="Grey canvas, white cards, sunken wells" name="Surfaces" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Surfaces</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

</style></head><body>
<div class="row">
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#f5f5f7;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Canvas</div><div class="mono">--surface-canvas</div><div class="mono">#f5f5f7</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#ffffff;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Card</div><div class="mono">--surface-card</div><div class="mono">#ffffff</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#efeff4;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Sunken</div><div class="mono">--surface-sunken</div><div class="mono">#efeff4</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:rgba(120,120,128,0.12);box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Fill</div><div class="mono">--surface-fill</div><div class="mono">rgba(120,120,128,0.12)</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.72);box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Material</div><div class="mono">--material-thick</div><div class="mono">rgba(255,255,255,0.72)</div></div>
</div>
</div>
</body></html>
