# Best-practice authoring templates for JEE Main Modern Physics concepts
# (dual-nature-matter, atoms-and-nuclei, semiconductor-electronics).
#
# NO top-level `stances:` opt-in key on this file, on purpose — see
# jee-mechanics.yaml's header for the full rationale.
#
# Audience note: an anxious Indian Class 11-12 student sitting JEE Main.
# ELI5, short sentences, Indian English, every technical term glossed on
# first use. No curriculum-bridge audit exists for Physics against any state
# board, so treat this as first-time-depth instruction, not a refresher.
#
# Family shape (modern_physics): intuition is a data visual (the experiment
# that broke the old model), formalism states the governing law, worked
# example is a numeric problem, practice checks a numeric substitution. The
# one thing this template insists on that no other family's guidance quite
# captures: show the EXPERIMENTAL OBSERVATION or graph that forced physicists
# to abandon the classical picture (stopping potential vs frequency; the line
# spectrum of hydrogen; the diode's current-voltage curve) BEFORE stating the
# quantum-mechanical law that explains it — the physical setup here is an
# experiment and a graph, not a diagram of forces, but the "setup before
# formula" discipline is identical. State every unit explicitly, including
# the ones this topic uses that mechanics doesn't (electron-volt, angstrom).

topic_family: jee-modern-physics

intuition:
  scaffold: physical-setup-before-formula
  guidance: |
    Open by describing the experimental observation in plain words — light
    of a certain colour hits a metal plate and electrons fly off instantly,
    no matter how dim the light, but only above a certain colour threshold
    — before any equation appears. Gloss every technical word on first use
    (e.g. "work function" — the minimum energy an electron needs to escape
    a metal's surface, like the height of a wall it must climb over). Only
    once the observation is fixed should the quantum-mechanical law appear
    to explain it.
  bloom_floor: 2

  stances:
    shaken: |
      Skip the general statement. Pick one small, fully-numbered
      observation (one given frequency of light, one given work function)
      and work through what it predicts by hand before any symbol appears
      in general form. End on one thing to do next time (e.g. "always
      convert electron-volts to joules before mixing them with SI values"),
      phrased as an action. No praise, no mention of feelings.
    assured: |
      Skip the setup — a confident reader already knows the experiment. Go
      straight to the one condition that costs marks: mixing up energy in
      eV with energy in joules, or an assumption (a single electron
      absorbing a single photon) a shortcut silently needs. Give a genuine
      counterexample, not a restatement.

formal_definition:
  scaffold: law-with-units
  guidance: |
    State the law in full symbolic form with display math (Einstein's
    photoelectric equation, the de Broglie relation, the radioactive decay
    law), name the unit of every quantity explicitly — including
    electron-volt (eV) and angstrom (1 angstrom = 10^-10 m) where the topic
    uses them instead of pure SI. Two-sentence prose cap around the display
    math. Name every symbol once in plain words on first use.
  bloom_floor: 3

worked_example:
  scaffold: diagram-then-numbers
  guidance: |
    Start with a one-line description of what is physically happening
    (a photon striking a surface, an unstable nucleus decaying, a diode
    being forward-biased) before any number is substituted. Six steps
    maximum, each step one action (describe the process, write the
    governing law, substitute values with CONSISTENT units, solve,
    sanity-check that the answer's order of magnitude is physically
    plausible). Favour a JEE-flavoured shape (stopping potential from a
    given wavelength, half-life from a given decayed fraction, a diode's
    forward current from its characteristic curve) over a bare
    plug-in-the-formula problem. Steps separated by `\n---\n`. Final line
    "Answer: ..." with its unit.
  bloom_floor: 3

  stances:
    shaken: |
      One action per step, no exceptions — describe the process, write the
      law, substitute with consistent units, solve, check, each on its own
      line. Push every "why" into the walkthrough's prompts/hints. End with
      the check run explicitly (is the answer's order of magnitude
      sensible for an atomic or nuclear quantity), not just claimed.
    assured: |
      Lead with the shortcut a first pass doesn't always emphasise — using
      hc = 1240 eV.nm directly instead of converting through joules, or
      the half-life shortcut for a decayed fraction that's a clean power of
      1/2 — and state the one condition that must hold for the shortcut to
      apply before using it.

common_traps:
  scaffold: wrong-then-right
  guidance: |
    Two to three trap pairs, each: the wrong move, the right move, and one
    line on why the wrong move feels natural. Favour traps specific to
    JEE-level modern physics: forgetting to convert eV to joules (or vice
    versa) before combining with an SI quantity, confusing frequency
    threshold with intensity threshold in the photoelectric effect
    (intensity never determines whether electrons are emitted at all),
    or mixing up half-life with mean life in a radioactive-decay
    calculation.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  guidance: |
    One fast question, same shape as the worked_example but with different
    numbers. Keep the arithmetic small enough to finish in under a minute —
    round wavelengths, simple whole-number half-lives.
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  guidance: |
    Front asks for the law or relation by name (e.g. "Einstein's
    photoelectric equation", "de Broglie wavelength"); back gives the
    symbolic form and the constant it needs (hc, Planck's constant). Used
    by SM-2 spaced repetition.
  bloom_floor: 2

visual_analogy:
  scaffold: experimental-graph-picture
  guidance: |
    Describe the experimental graph or data pattern that motivates the law
    — stopping potential rising in a straight line with frequency above a
    threshold, a nucleus's activity dropping steadily over time.

    Radioactive decay is a strong, explicitly-named fit for `function-trace`
    (N(t) = N0*exp(-lambda*t) is a genuine single-variable exponential
    curve). Schema:

    ```gif-scene
    {"type":"function-trace","expression":"100*exp(-0.1*x)","x_range":[0,20],"y_range":[0,100],"frames":30,"fps":12}
    ```

    Allowed expression tokens: x, t, +, -, *, /, ^, parens, numbers, and
    sin/cos/tan/log/ln/exp/sqrt/abs/pi/e. OMIT the block for anything that
    doesn't reduce cleanly to a 2D plot — the shape of an atomic orbital, a
    nuclear energy-level diagram, or the internal band structure of a
    semiconductor junction — never invent a misleading scene.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  guidance: |
    One representative JEE Main stem (MCQ or numerical-value) with a
    one-line "when you see this phrasing, do X" cue — e.g. "when the
    question gives wavelength in angstroms and asks for energy in eV, use
    hc = 1240 eV.nm and convert the angstrom value to nm first." JEE Main
    Paper 1 asks 25 questions per subject: 20 MCQs (+4/-1) and 5 compulsory
    numerical-value questions — do not invent a per-topic weightage beyond
    that.
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  guidance: |
    A short, memorable line for a rule that's easy to mix up (hc = 1240
    eV.nm as a ready-to-use constant, or the distinction between half-life
    and mean life).
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  guidance: |
    Three problems mixing two related ideas from this concept family (e.g.
    a dual-nature-matter question about photon energy feeding into an
    atoms-and-nuclei question about the energy released in a hydrogen
    transition of the same magnitude).
  bloom_floor: 4

hook:
  scaffold: experiment-that-broke-the-old-model
  guidance: |
    Open on one concrete, fully-numbered observation small enough to
    picture immediately. Name the JEE-specific twist up front (e.g. "you
    shine a brighter light of the SAME colour on the metal plate — does the
    maximum kinetic energy of the ejected electrons go up at all?").

    Fuse the hook into a scripted beat sequence rather than a static
    sentence: emit a fenced interactive-spec block at the end of the body
    (mirrors the gif-scene pattern used under visual_analogy). Schema:

    ```interactive-spec
    {"v":1,"kind":"simulation","title":"...","x_expr":"...","y_expr":"...",
     "t_min":0,"t_max":1,
     "narration_steps":[
       {"at_progress":0,"text":"..."},
       {"at_progress":0.5,"text":"...","trap":{"text":"what students get wrong","avoid":"the one-line fix"}}
     ],
     "ghost":{"x_expr":"...","y_expr":"..."}}
    ```

    3-5 narration_steps beats, synced to at_progress (0..1). Exactly ONE
    beat carries a "trap" — weave it from this concept's authored
    common-traps.md, not a fresh guess. Radioactive decay's exponential
    curve is a strong fit here. OMIT the fence entirely for concepts that
    don't reduce to a 2D parametric/trace scene (orbital shapes, band
    diagrams) — never invent a misleading scene.
  bloom_floor: 1
  stances:
    shaken: |
      One concrete, fully-numbered instance, small enough to picture right
      now. No history, no "you'll need this later" framing — the reader is
      here after getting something wrong, and the useful move is one thing
      that works immediately.
    assured: |
      Name the exact JEE phrasing this concept hides behind, and the one
      shortcut students reach for under time pressure that silently fails
      (assuming intensity affects the photoelectric threshold, or treating
      half-life as if activity dropped in a straight line rather than
      exponentially).
