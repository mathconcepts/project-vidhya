# ── Stance rollout opt-in ────────────────────────────────────────────────
# This TOP-LEVEL `stances:` key is the opt-in signal read by
# loadTopicsWithStancesBlock() in src/api/admin-content-maturity-routes.ts.
# Its presence declares "this topic is in the authored-stance rollout", which
# puts every one of the topic's concepts into the maturity report's rollout
# denominator.
#
# Do not confuse it with the per-atom-type `stances:` blocks further down.
# Those are AUTHORING GUIDANCE, read by topicGuidanceFor() when generating a
# variant, and every one of the eleven topic templates already carries them —
# which is precisely why they cannot double as the opt-in signal. If they did,
# every topic would opt in at once and the rollout denominator would equal the
# course-wide one, collapsing the two figures the report deliberately keeps
# apart.
#
# Linear Algebra opts in because it is genuinely finished: all 26 of its
# concepts carry a shaken and an assured body for all three narrative atom
# types. Add this key to another topic only when that is true of it too —
# opting in early makes the rollout figure amber, which is the honest signal,
# but opting in a topic nobody is working on just adds noise.
stances:
  rollout: authored
  variants: [shaken, assured]

topic_family: linear-algebra

intuition:
  scaffold: geometric-transformation
  guidance: |
    Lead with what the matrix DOES geometrically (rotate, stretch, project).
    Then connect to the algebraic representation.
  bloom_floor: 2

  stances:
    shaken: |
      Open on concrete numbers, not on the general object. Pick one small
      matrix or one pair of vectors, do the arithmetic in full, and let the
      symbol arrive after the reader has already seen the thing happen.
      Close by naming the single idea to hold onto, and make it the idea that
      unlocks the rest of the topic rather than a summary of what was said.
      No praise, no reassurance, and no mention of how the reader might be
      feeling. A small win steadies someone; being told they are struggling
      does not.
    assured: |
      Assume the mechanics. Spend the space on the distinction that actually
      costs marks — where two neighbouring ideas are not interchangeable, or
      where a condition is necessary and nowhere near sufficient. Give a
      counterexample rather than a restatement. Do not re-derive anything.
formal_definition:
  scaffold: matrix-form
  guidance: |
    State the rule in matrix notation with display math. Include dimensions
    explicitly (e.g., A is m×n).
  bloom_floor: 3

worked_example:
  scaffold: step-unfold
  guidance: |
    For eigenvalues: write characteristic polynomial → solve → find
    eigenvectors → verify Av = λv. Six steps max, separated by `\n---\n`.
  bloom_floor: 3

  stances:
    shaken: |
      Keep the body skeletal: the problem, the step headings, the display
      maths, the boxed answer. Every "why" belongs in the walkthrough's
      prompts and hints, where it unfolds one step at a time when the reader
      asks for it. Split a step in two rather than explaining it at length on
      the page. Make the final check explicit and show it being run.
    assured: |
      The efficient route, and the trap on it. Where a shortcut exists — trace
      and determinant, a symmetry, a row operation that collapses the work —
      lead with it and say what has to be true for it to apply. Skip the
      arithmetic a confident reader can do in their head.
common_traps:
  scaffold: wrong-then-right
  guidance: |
    Common: confusing eigenvalues with eigenvectors, wrong det formula,
    missing the AB ≠ BA point.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  guidance: |
    Small 2×2 or 3×3 matrix, one operation.
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  bloom_floor: 2

visual_analogy:
  scaffold: vector-grid-transform
  guidance: |
    Embed :::math3d{...} or a static vector-field image showing how unit
    vectors transform under the matrix.

    When the concept reduces to a 2D function plot (eigenvalue scaling
    along an axis, rank-1 projections, parametric curves), ALSO emit a
    fenced gif-scene block at the end of the body. Schema:

    ```gif-scene
    {"type":"function-trace","expression":"2*x","x_range":[-2,2],"y_range":[-4,4],"frames":30,"fps":12}
    ```

    Allowed tokens: x, t, +, -, *, /, ^, parens, numbers, sin/cos/tan/log/
    ln/exp/sqrt/abs/pi/e. OMIT the block for matrix algebra, dimension
    arguments, or anything that doesn't reduce cleanly to a 2D plot.
    Never invent a misleading scene.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  bloom_floor: 4

hook:
  scaffold: transformation-question
  guidance: |
    Open on one concrete instance, small enough to verify by hand.

    Fuse the hook into a scripted beat sequence rather than a static
    sentence: emit a fenced interactive-spec block at the end of the body
    (mirrors the gif-scene pattern used under visual_analogy). Schema:

    ```interactive-spec
    {"v":1,"kind":"simulation","title":"...","x_expr":"...","y_expr":"...",
     "t_min":0,"t_max":1,
     "narration_steps":[
       {"at_progress":0,"text":"..."},
       {"at_progress":0.5,"text":"...","trap":{"text":"what students get wrong","avoid":"the one-line fix"}}
     ],
     "ghost":{"x_expr":"...","y_expr":"..."}}
    ```

    3-5 narration_steps beats, synced to at_progress (0..1). Exactly ONE
    beat carries a "trap" — weave it from this concept's authored
    common-traps.md, not a fresh guess. The "ghost" field, when present,
    traces the mistaken path dashed. OMIT the fence entirely for concepts
    that don't reduce to a 2D parametric/trace scene (matrix algebra,
    dimension arguments, existence proofs) — never invent a misleading
    scene.
  bloom_floor: 1
  stances:
    shaken: |
      One concrete instance, small enough to verify by hand in a few seconds.
      No motivation section, no history, no promise about what the topic will
      unlock later. The reader is here after getting things wrong; the useful
      move is one thing that works, immediately.
    assured: |
      State the sharpest form of the idea and the one place it is commonly
      misapplied. A confident reader does not need to be sold the topic.
