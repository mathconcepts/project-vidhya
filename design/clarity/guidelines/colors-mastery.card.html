<!-- @dsCard group="Colors" viewport="700x180" subtitle="Green — correct, mastered, primary action" name="Mastery green" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mastery green</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

</style></head><body>
<div class="row">
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#34c759;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Green</div><div class="mono">--green</div><div class="mono">#34c759</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#2fb350;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Pressed</div><div class="mono">--green-press</div><div class="mono">#2fb350</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#248a3d;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Ink (text)</div><div class="mono">--green-ink</div><div class="mono">#248a3d</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:rgba(52,199,89,0.12);box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Tint</div><div class="mono">--green-tint</div><div class="mono">rgba(52,199,89,0.12)</div></div>
</div>
</div>
<p class="lbl" style="margin-top:14px">Fills use --green; text and glyphs on white use --green-ink for 4.5:1 contrast.</p>
</body></html>
