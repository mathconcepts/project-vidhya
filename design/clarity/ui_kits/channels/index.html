<!-- @dsCard group="Channels" viewport="1100x700" subtitle="Telegram and WhatsApp — message shape, not pixels" name="Messaging channels" -->
<!-- @startingPoint section="Channels" subtitle="Link, ask, snap — the bot conversation" viewport="1100x700" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vidhya — messaging channels</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<style>
  body { padding: 24px; display: flex; gap: 32px; align-items: flex-start; justify-content: center; }
  .phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; flex: none;
    box-shadow: 0 0 0 10px #1d1d1f, 0 30px 70px -20px rgba(0,0,0,.45); background: #efeae2; }
  .phone[data-app="tg"] { background: #eef3f7; }
  .status { height: 50px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 6px; font: 600 14px var(--font-sans); letter-spacing: -.01em; flex: none; color: #1d1d1f; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 6px 16px 12px; flex: none;
    background: rgba(255,255,255,.72); backdrop-filter: var(--blur-nav); border-bottom: .5px solid var(--separator); }
  .av { width: 36px; height: 36px; border-radius: 999px; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; font: 600 16px var(--font-sans); letter-spacing: -.03em; }
  .thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
  .thread::-webkit-scrollbar { display: none; }
  .msg { max-width: 84%; padding: 9px 13px; border-radius: 14px; background: #fff;
    font: 400 16px var(--font-sans); line-height: 1.45; color: var(--text-primary);
    box-shadow: 0 1px 1px rgba(0,0,0,.08); white-space: pre-line; }
  .msg.me { align-self: flex-end; background: #d9fdd3; }
  .phone[data-app="tg"] .msg.me { background: #e3f0ff; }
  .msg .time { display: block; margin-top: 4px; font: 400 12px var(--font-sans); color: var(--text-tertiary); text-align: right; }
  .msg .link { color: var(--text-link); word-break: break-all; }
  .msg .verified { display: block; margin-top: 8px; font: 500 14px var(--font-sans); color: var(--green-ink); }
  .msg img, .msg .photo { display: block; width: 210px; height: 130px; border-radius: 10px; background: #f6f4ef;
    color: #2b2b2b; font: 400 19px var(--font-serif); display: flex; align-items: center; justify-content: center; }
  .composer { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px 26px;
    background: rgba(255,255,255,.72); backdrop-filter: var(--blur-nav); border-top: .5px solid var(--separator); }
  .field { flex: 1; height: 40px; border-radius: 999px; background: #fff; display: flex; align-items: center;
    padding: 0 16px; font: 400 16px var(--font-sans); color: var(--text-tertiary); }
  .send { width: 40px; height: 40px; border-radius: 999px; background: var(--indigo); color: #fff; border: none;
    display: flex; align-items: center; justify-content: center; }

  .rail { width: 330px; }
  .rail h1 { font: 600 28px var(--font-sans); letter-spacing: -.018em; margin: 0 0 10px; }
  .rail p { font: 400 15px var(--font-sans); color: var(--text-secondary); line-height: 1.55; margin: 0 0 18px; }
  .stage { display: block; width: 100%; text-align: left; background: none; cursor: pointer; border: none;
    border-top: .5px solid var(--separator); padding: 13px 0; }
  .stage:last-of-type { border-bottom: .5px solid var(--separator); }
  .stage b { display: block; font: 600 15px var(--font-sans); letter-spacing: -.01em; }
  .stage span { display: block; font: 400 14px var(--font-sans); color: var(--text-secondary); margin-top: 2px; line-height: 1.45; }
  .stage[data-active] b { color: var(--indigo-ink); }
  .toggle { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 2px; border-radius: 12px;
    background: var(--surface-fill); margin-bottom: 20px; }
  .toggle button { height: 34px; padding: 0 16px; border: none; border-radius: 10px; background: none; cursor: pointer;
    font: 500 14px var(--font-sans); color: var(--text-secondary); }
  .toggle button[data-on] { background: var(--surface-card); box-shadow: var(--shadow-raise);
    color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>

<div class="rail">
  <h1>No pixels, only shape</h1>
  <p>A messaging channel has no colour, no type scale and no layout. What the system contributes here is message shape, sequence and restraint: under four lines, plain text, no emoji, and never a message the student didn't ask for.</p>
  <div class="toggle">
    <button data-app="wa" data-on onclick="setApp('wa')">WhatsApp</button>
    <button data-app="tg" onclick="setApp('tg')">Telegram</button>
  </div>
  <button class="stage" data-stage="link" onclick="go('link')" data-active><b>M1 · Linking</b><span>Two lines: what it does, then the link. Confirmation is one line.</span></button>
  <button class="stage" data-stage="snap" onclick="go('snap')"><b>M3 · A photo</b><span>Read it back, then solve. The receipt is a final line, not a badge.</span></button>
  <button class="stage" data-stage="limits" onclick="go('limits')"><b>M6 · The limits</b><span>Three commands. Say what the channel can't do, and where it can be done.</span></button>
</div>

<div class="phone" id="phone" data-app="wa">
  <div class="status"><span>9:41</span><span style="display:flex;gap:5px;align-items:center"><i data-lucide="signal" style="width:15px"></i><i data-lucide="wifi" style="width:15px"></i><i data-lucide="battery-full" style="width:19px"></i></span></div>
  <div class="bar">
    <i data-lucide="chevron-left" style="width:22px;color:var(--indigo-ink)"></i>
    <div class="av">V</div>
    <div>
      <div style="font:600 17px var(--font-sans);letter-spacing:-.01em">Vidhya</div>
      <div style="font:400 13px var(--font-sans);color:var(--text-secondary)" id="presence">bot · online</div>
    </div>
  </div>

  <div class="thread" id="thread"></div>

  <div class="composer">
    <i data-lucide="plus" style="width:22px;color:var(--text-secondary)"></i>
    <span class="field">Message</span>
    <button class="send" aria-label="Send"><i data-lucide="arrow-up" style="width:18px"></i></button>
  </div>
</div>

<script>
  const THREADS = {
    link: [
      ['me', '/start', '9:38'],
      ['them', 'Welcome to Vidhya.\n\nLinking this chat lets you ask questions and send photos of problems here, with your progress saved to your account.\n\nvidhya.app/link/8f3ac2', '9:38'],
      ['me', '(signed in)', '9:39'],
      ['them', 'Linked as Priya. Send a photo of a problem, or just ask.', '9:39'],
    ],
    snap: [
      ['me', 'photo', '9:41'],
      ['them', 'I read this as: ∫ x·e^x dx\n\nIf that\u2019s wrong, type it out and I\u2019ll use yours.', '9:41'],
      ['me', 'yes that\u2019s it', '9:41'],
      ['them', '∫ x·e^x dx = e^x(x − 1) + C\n\nTake u = x and dv = e^x dx. One round of parts is enough — the x disappears and what\u2019s left is an integral you already know.|verified', '9:42'],
      ['them', 'Saved to your notes. Want one like it to try?', '9:42'],
    ],
    limits: [
      ['me', '/help', '9:44'],
      ['them', '/start — link this chat to your account\n/me — who you\u2019re signed in as\n/help — this message\n\nYou can also send a photo of a problem or ask a question in plain words.', '9:44'],
      ['me', 'can you run my mock exam here?', '9:45'],
      ['them', 'Not here — a timed paper needs the app. Open vidhya.app/mock and I\u2019ll have it ready.\n\nQuestions and photos work fine in this chat.', '9:45'],
    ],
  };

  function render(key) {
    const t = document.getElementById('thread');
    t.innerHTML = THREADS[key].map(([who, body, time]) => {
      if (body === 'photo') {
        return '<div class="msg me"><span class="photo">∫ x·e<sup>x</sup> dx = ?</span><span class="time">' + time + '</span></div>';
      }
      const [text, flag] = body.split('|');
      const linked = text.replace(/(vidhya\.app\/[^\s]+)/g, '<span class="link">$1</span>');
      const verified = flag === 'verified' ? '<span class="verified">Verified with Wolfram.</span>' : '';
      return '<div class="msg ' + (who === 'me' ? 'me' : '') + '">' + linked + verified + '<span class="time">' + time + '</span></div>';
    }).join('');
    t.scrollTop = t.scrollHeight;
  }
  function go(name) {
    document.querySelectorAll('.stage').forEach(s => s.toggleAttribute('data-active', s.dataset.stage === name));
    render(name);
  }
  function setApp(app) {
    document.getElementById('phone').setAttribute('data-app', app);
    document.querySelectorAll('.toggle button').forEach(b => {
      if (b.dataset.app === app) b.setAttribute('data-on', ''); else b.removeAttribute('data-on');
    });
    document.getElementById('presence').textContent = app === 'tg' ? 'bot' : 'business account';
  }
  render('link');
  lucide.createIcons();
</script>
</body>
</html>
