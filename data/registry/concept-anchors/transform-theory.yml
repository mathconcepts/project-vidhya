version: 1
topic: transform-theory
concepts:
  fourier-series:
    anchor: "Power-quality engineers break a distorted, repeating AC waveform into its harmonics to find the exact one overheating a transformer, without ever touching the transformer itself."
  fourier-transform:
    anchor: "Noise-cancelling headphones work out which frequencies a jet engine's non-repeating rumble is made of, then play exactly those back inverted so the two waveforms cancel in your ear."
  inverse-laplace:
    anchor: "After solving a car suspension's motion equation in transformed form, engineers invert it back to get the actual bounce-versus-time graph they can watch happen on a test rig."
  laplace-applications:
    anchor: "Power engineers modelling the instant a circuit breaker switches on fold the exact starting voltage and current into the transform, predicting the surge before the switch is ever thrown."
  laplace-transform:
    anchor: "Control engineers designing a car's cruise-control system turn its messy differential equation into simple algebra with this transform, so the response can be tuned before any road test."
  z-transform:
    anchor: "A smartphone's audio chip never sees a continuous wave, only a stream of numbers; the z-transform lets engineers design the filter recipe that runs one sample at a time."
