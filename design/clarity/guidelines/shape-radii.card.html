<!-- @dsCard group="Shape" viewport="700x200" subtitle="8 / 12 / 16 / 20 / 28 and capsule" name="Corner radii" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Corner radii</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

</style></head><body>
<div class="row">
<div class="col" style="gap:6px;align-items:center"><div style="width:84px;height:64px;border-radius:8px;background:var(--surface-card);box-shadow:var(--shadow-raise)"></div><div class="mono">--radius-xs · 8</div></div><div class="col" style="gap:6px;align-items:center"><div style="width:84px;height:64px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-raise)"></div><div class="mono">--radius-sm · 12</div></div><div class="col" style="gap:6px;align-items:center"><div style="width:84px;height:64px;border-radius:16px;background:var(--surface-card);box-shadow:var(--shadow-raise)"></div><div class="mono">--radius-md · 16</div></div><div class="col" style="gap:6px;align-items:center"><div style="width:84px;height:64px;border-radius:20px;background:var(--surface-card);box-shadow:var(--shadow-raise)"></div><div class="mono">--radius-lg · 20</div></div><div class="col" style="gap:6px;align-items:center"><div style="width:84px;height:64px;border-radius:28px;background:var(--surface-card);box-shadow:var(--shadow-raise)"></div><div class="mono">--radius-xl · 28</div></div>
<div class="col" style="gap:6px;align-items:center"><div style="width:84px;height:44px;border-radius:999px;background:var(--surface-card);box-shadow:var(--shadow-raise)"></div><div class="mono">capsule</div></div>
</div>
<p class="lbl" style="margin-top:14px">Nest by subtraction: a child inside a 20px card with 16px padding gets 8px, not 20px.</p>
</body></html>
