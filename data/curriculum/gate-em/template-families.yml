    hooks: [accumulation_story, area_or_balance_intuition]
    source_sequence: "hook → geometric_intuition → rule_or_theorem → worked_example → bounds_or_convergence_check → recall_prompt → timed_check"
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: geometric_intuition }
      - { id: formalism,      atom_kind: worked_example,       presentation: rule_or_theorem }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_example }
      - { id: practice,       atom_kind: mcq,                  presentation: bounds_or_convergence_check }

  optimization:
    label: Optimization
    hooks: [decision_under_constraint, visual_landscape]
    source_sequence: "hook → visual_landscape → conditions → method_selection → worked_example → second_order_or_boundary_check → recall_prompt"
    # method_selection is a genuine decision point in the source sequence —
    # given a guided_walkthrough/decision_tree stage, same treatment as ode
    # below (see this file's header note).
    stages:
      - { id: intuition,      atom_kind: visual_analogy,        presentation: visual_landscape }
      - { id: formalism,      atom_kind: worked_example,         presentation: conditions }
      - { id: discovery,      atom_kind: guided_walkthrough,     presentation: decision_tree }
      - { id: worked_example, atom_kind: worked_example,         presentation: worked_example }
