# Project Vidhya LLM Provider Registry
# Hot-swappable provider configuration

version: "2.0"
default_provider: gemini

providers:
  gemini:
    enabled: true
    api_key_env: GEMINI_API_KEY
    priced_at: "2026-08-03"
    models:
      flash:
        # Was gemini-2.0-flash — bumped to match the id every other part of
        # this app already uses (provider-registry.ts's BYOK chat registry,
        # the RunLauncher model dropdown). The old id was never wrong per
        # se, just a second, drifted truth for "which Gemini model" — see
        # registry.ts's header comment on why that class of bug matters.
        id: "gemini-2.5-flash"
        context_window: 1000000
        max_output: 8192
        cost_per_1k_input: 0.000075
        cost_per_1k_output: 0.0003
        tier: routine
      pro:
        id: "gemini-2.5-pro"
        context_window: 2000000
        max_output: 8192
        cost_per_1k_input: 0.00125
        cost_per_1k_output: 0.005
        tier: quality
    fallback_order: [flash, pro]
    health_check:
      endpoint: /health
      interval_seconds: 60
      timeout_ms: 5000

  anthropic:
    enabled: true
    api_key_env: ANTHROPIC_API_KEY
    priced_at: "2026-08-03"
    models:
      sonnet:
        # Was claude-sonnet-4-20250514 / claude-haiku — same drift fix as
        # gemini above; these ids didn't match provider-registry.ts's
        # claude-sonnet-4-5 / claude-haiku-4-5, nor the RunLauncher
        # dropdown's (differently-drifted) claude-sonnet-4-6, so picking
        # "Claude" in the generation-run launcher threw ModelRetiredError.
        id: "claude-sonnet-4-5"
        context_window: 200000
        max_output: 8192
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        tier: quality
      haiku:
        id: "claude-haiku-4-5"
        context_window: 200000
        max_output: 4096
        cost_per_1k_input: 0.00025
        cost_per_1k_output: 0.00125
        tier: routine
    fallback_order: [haiku, sonnet]

  openai:
    enabled: true
    api_key_env: OPENAI_API_KEY
    priced_at: "2026-08-02"
    models:
      gpt4o:
        id: "gpt-4o"
        context_window: 128000
        max_output: 4096
        cost_per_1k_input: 0.005
        cost_per_1k_output: 0.015
        tier: quality
      gpt4o_mini:
        id: "gpt-4o-mini"
        context_window: 128000
        max_output: 4096
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
        tier: routine
    fallback_order: [gpt4o_mini, gpt4o]

  openrouter:
    enabled: true
    api_key_env: OPENROUTER_API_KEY
    priced_at: "2026-08-03"
    base_url: "https://openrouter.ai/api/v1"
    models:
      # Model ids match provider-registry.ts's openrouter entries (the
      # BYOK chat registry) — one key, routed to the underlying model.
      # Costs are inherited from that underlying model's own pricing row
      # above (OpenRouter's markup is small and varies by model; treat
      # these as estimates, same caveat as every other cost_per_1k here).
      gemini_flash:
        id: "google/gemini-2.5-flash"
        context_window: 1000000
        max_output: 8192
        cost_per_1k_input: 0.000075
        cost_per_1k_output: 0.0003
        tier: routine
      claude_sonnet:
        id: "anthropic/claude-sonnet-4-5"
        context_window: 200000
        max_output: 8192
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        tier: quality
      gpt4o:
        id: "openai/gpt-4o"
        context_window: 128000
        max_output: 4096
        cost_per_1k_input: 0.005
        cost_per_1k_output: 0.015
        tier: quality
    fallback_order: [gemini_flash, claude_sonnet, gpt4o]

  ollama:
    enabled: false
    # No api_key_env — local, keyless by design.
    priced_at: "2026-08-02"
    base_url: "http://localhost:11434"
    models:
      llama:
        id: "llama3.2"
        context_window: 8192
        max_output: 4096
        cost_per_1k_input: 0
        cost_per_1k_output: 0
        tier: local
    fallback_order: [llama]

  learnlm:
    enabled: true
    # Shares Gemini's key (learnlm is served on the same Gemini API surface;
    # see API_KEY_ENV in src/llm/index.ts).
    api_key_env: GEMINI_API_KEY
    priced_at: "2026-08-02"
    models:
      tutor:
        id: "learnlm-2.0-flash-experimental"
        context_window: 32000
        max_output: 8192
        cost_per_1k_input: 0
        cost_per_1k_output: 0
        tier: pedagogical
        specialization: tutoring
    fallback_order: [tutor]

# Task-to-tier routing
task_routing:
  quality_critical:
    - content_generation
    - lesson_creation
    - assessment_creation
    - blog_writing
  routine:
    - summarization
    - classification
    - extraction
    - simple_qa
  pedagogical:
    - tutoring
    - doubt_resolution
    - socratic_dialogue
    - learning_assessment

# Fallback strategy
fallback:
  strategy: waterfall
  max_retries: 3
  retry_delay_ms: 1000
  degradation_levels:
    - name: primary
      providers: [gemini, anthropic]
    - name: fallback
      providers: [openai, openrouter, ollama]
    - name: emergency
      providers: [ollama]
      alert: true

# Budget controls
budget:
  daily_limit_usd: 100
  warning_threshold: 0.8
  per_agent_limits:
    sage: 50
    atlas: 30
    herald: 10
    scout: 5
    oracle: 5
