# Concept anchors — linear-algebra
#
# ONE plain sentence per concept, rendered at the top of the first lesson
# card before any mathematics. Contract v1 (see
# docs/designs/2026-09-18-concept-anchor-and-rendering-agenda.md §4):
# <=100 characters (~3 rendered lines at 375px), a concrete named system,
# carries the bridge not a name-drop, no notation, no exam framing, true
# and direction-precise.
version: 1
topic: linear-algebra
concepts:
  cayley-hamilton:
    anchor: "Cayley-Hamilton turns a control system's matrix powers into one short, exact polynomial."
  change-of-basis:
    anchor: "A change-of-basis matrix lets an autopilot convert velocity from body frame to Earth frame."
  determinants:
    anchor: "A robot arm's software watches its motion matrix's determinant; zero means a lost direction."
  diagonalization:
    anchor: "Diagonalizing a spring-linked pair of vibrating masses' matrix decouples their tangled motion."
  eigenvalues:
    anchor: "PageRank treats the web as a matrix and ranks pages by its dominant eigenvector."
  gram-schmidt:
    anchor: "Gram-Schmidt straightens a 3D camera's rough 'up' vector so it's perpendicular to forward."
  inner-product-spaces:
    anchor: "A spectrum analyzer measures a song's bass as the inner product with a reference wave."
  jordan-normal-form:
    anchor: "A critically-damped shock absorber's decay term comes from Jordan form, when eigenvectors repeat."
  least-squares:
    anchor: "A GPS receiver's extra, slightly conflicting satellite readings are reconciled by least squares."
  linear-independence:
    anchor: "A quadcopter loses a direction of control if two propeller thrust combinations aren't independent."
  linear-transformations:
    anchor: "A game engine rotates a character's thousands of vertices at once by multiplying each by one matrix."
  lu-factorization:
    anchor: "Bridge software factors the stiffness matrix once, then reuses it for fifty different load cases."
  matrix-inverse:
    anchor: "Decrypting multiplies by the scrambling matrix's inverse, which exists only if scrambling is unique."
  matrix-norms:
    anchor: "Simulation software checks a matrix's condition number before trusting its answer is accurate."
  matrix-operations:
    anchor: "A robot arm's shoulder-then-elbow rotation isn't elbow-then-shoulder — matrix order matters."
  null-space-column-space:
    anchor: "A robot arm dodges obstacles using joint motions in its Jacobian's null space, hand unmoved."
  orthogonality:
    anchor: "Wifi splits one signal across frequency channels chosen orthogonal so none leak into another."
  positive-definite-matrices:
    anchor: "A training algorithm checks its loss curvature is positive definite to confirm a dip, not a saddle."
  quadratic-forms:
    anchor: "A GPS position-error ellipse's shape comes from a quadratic form built from its error data."
  rank-nullity:
    anchor: "Rank-nullity fixes how much of a spacecraft's state its sensors can measure versus stay hidden."
  spectral-theorem:
    anchor: "The spectral theorem guarantees PCA's covariance eigen-directions are always perpendicular."
  svd:
    anchor: "A photo compresses to a tenth its size by keeping only its largest SVD singular values."
  symmetric-matrices:
    anchor: "A bridge's stiffness matrix is symmetric: push A, measure sag at B equals push B, measure sag at A."
  systems-of-equations:
    anchor: "Solving a circuit's Kirchhoff's-law equations shows if every current is fixed, free, or impossible."
  trace:
    anchor: "A positive trace on a structure's system matrix guarantees vibration grows, not dies out."
  vector-spaces:
    anchor: "Mixing songs adds their waveforms and volume scales them — the same rules that govern arrows."
