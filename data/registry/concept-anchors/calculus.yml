# Concept anchors — calculus
#
# ONE plain sentence per concept, rendered at the top of the first lesson
# card before any mathematics. Contract v1 (see
# docs/designs/2026-09-18-concept-anchor-and-rendering-agenda.md §4):
# <=30 words, concrete system, carries the bridge not a name-drop, no
# notation, no exam framing, true and direction-precise.
version: 1
topic: calculus
concepts:
  chain-rule:
    anchor: "A cruise control's throttle sets engine RPM, and RPM sets road speed — the system multiplies each link's own rate of change to know how far to adjust the throttle."
  continuity:
    anchor: "Self-driving cars assume a tracked pedestrian's position never jumps between camera frames; testing that assumption is exactly checking continuity, before any motion-prediction math is trusted."
  definite-integrals:
    anchor: "A smart electricity meter integrates your power draw all day to bill you — power exported back to the grid counts negative, subtracting instead of adding to the total."
  derivatives-basic:
    anchor: "A car's speedometer doesn't show your total distance travelled — it shows the derivative, how fast that distance is changing at this exact instant."
  differentiability:
    anchor: "A self-driving car's planned path being continuous stops it teleporting, but only being differentiable too stops the steering wheel from snapping to a new angle instantly, jolting the passengers."
  implicit-differentiation:
    anchor: "In a sealed gas canister, pressure and volume are tangled in one equation; implicit differentiation finds how fast pressure changes as volume changes, without solving for pressure first."
  improper-integrals:
    anchor: "A bond paying interest forever still has a finite price today — improper integrals check whether an endless payment stream adds to a finite total, or blows up."
  integration-basics:
    anchor: "A fitness tracker doesn't measure calories burned directly — it measures your burn rate every second and integrates it, adding up all those instants into one final calorie count."
  integration-by-parts:
    anchor: "Working out the average wait for a randomly-arriving bus means integrating time times a decaying exponential — precisely the product integration by parts exists to solve."
  integration-substitution:
    anchor: null
    reason: "Substitution is an algebraic relabelling move for solving integrals that were set up by other physical reasoning; the honest real-world anchor belongs to whatever produced the integral, not to the relabelling step itself."
  limits:
    anchor: "A radar gun estimates a car's speed at this instant by tracking what the average speed approaches as the measurement window shrinks toward zero, never quite reaching it."
  maxima-minima:
    anchor: "A shipping company designing a box with a fixed amount of cardboard sets the volume's derivative to zero to find the dimensions that pack in the most space."
  mean-value-theorems:
    anchor: "Average-speed cameras clock your entry and exit time on a highway stretch — the Mean Value Theorem guarantees your speed matched that average at some exact instant in between."
  multiple-integrals:
    anchor: "A structural engineer finds a slab's total weight by adding density times tiny patches of area across its whole surface — accumulating across two directions at once, not just one."
  multivariable-calculus:
    anchor: "A hiking app's steepness reading for a hillside changes with the direction you walk — a partial derivative freezes every direction but one to answer just that."
  partial-fractions:
    anchor: "Engineers analyzing a circuit's response solve it in transform space, then break the tangled result into simple fractions to read off the actual voltage signal over time."
  product-quotient-rule:
    anchor: "A store's revenue is price times quantity sold, and both shift as a sale is adjusted — the product rule tracks the combined effect, not just multiplying their two rates."
  sequences:
    anchor: "A calculator finding a square root repeats one formula, generating a sequence of guesses that crowd closer and closer to the true answer without ever landing on it."
  series:
    anchor: "A bouncing ball loses a fixed fraction of height each bounce; it takes infinitely many bounces, yet the total distance travelled adds up to one finite number."
