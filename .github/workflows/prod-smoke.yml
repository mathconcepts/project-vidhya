name: Production smoke

# Post-deploy smoke check against the live demo instance.
#
# Why this exists: v4.28.0 shipped a demo walkthrough that was completely
# absent in production for two packaging reasons (a flag that was never set on
# the service, and a config file that was never copied into the image). Every
# unit test passed, all three content gates passed, and the feature was still
# missing, because nothing ever asked the deployed URL a question.
#
# The checks below are chosen to DISCRIMINATE between the old build and the new
# one, not merely to prove the service is up. A 200 on `/` says almost nothing;
# `/api/demo/rails` returning four cards can only happen when the flag is set
# AND config/demo-rails.json is inside the image.
#
# Runs on demand, and on a schedule so a silently-reverted deploy surfaces
# without anyone remembering to look. It talks to a public URL only: no secrets,
# no auth, nothing to leak.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to smoke test
        required: false
        default: https://vidhya-demo.onrender.com
      wait_minutes:
        description: How long to wait for a deploy to finish before failing
        required: false
        default: '10'
  # After every deploy. Render auto-deploys main on commit, so a merge is the
  # start of a deploy — the run then WAITS for that deploy to go live before
  # asserting anything (see the commit gate below). Without that wait this
  # trigger would be actively harmful: it would test the previous build,
  # seconds after the merge, and report success.
  push:
    branches: [main]
  schedule:
    # 09:00 UTC daily. Catches a rolled-back or crashed deploy.
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Required since the checks stopped being pure inline curl: the wait loop
      # is scripts/wait-for-http.sh and the version gate reads package.json.
      # Without this the job dies with `No such file or directory` (exit 127)
      # before it ever reaches the service — which is exactly what happened on
      # the first run after those two were introduced.
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Resolve target
        id: cfg
        run: |
          echo "url=${{ github.event.inputs.base_url || 'https://vidhya-demo.onrender.com' }}" >> "$GITHUB_OUTPUT"
          echo "wait=${{ github.event.inputs.wait_minutes || '10' }}" >> "$GITHUB_OUTPUT"

      # The wait loop lives in scripts/wait-for-http.sh so it can be tested.
      # It was four lines inline here and it was wrong: `curl ... || echo 000`
      # produced `000000` on a failed request, which matched neither the 5xx
      # nor the 000 case and fell through as "the service answered". The wait
      # was a no-op in exactly the situation it exists for. It went green for
      # weeks because the service happened to be up, then failed the first
      # time it was pointed at a deploy still in flight.
      # See src/__tests__/wait-for-http.test.ts.
      - name: Wait for the service to answer
        run: |
          bash scripts/wait-for-http.sh \
            '${{ steps.cfg.outputs.url }}' \
            $(( ${{ steps.cfg.outputs.wait }} * 60 ))

      # The check that actually answers "did MY build deploy".
      #
      # Everything below can pass against the PREVIOUS build, because Render
      # keeps serving it until the new one is healthy. A run started seconds
      # after a merge therefore verifies stale code and reports success.
      #
      # This gate used to compare /health.version against package.json, which
      # closed only half the hole: most merges do not bump the version, so the
      # deployed version already equalled the expected one the instant the run
      # started and the gate passed immediately — against the old build. A
      # commit is unique per merge and cannot collide that way.
      #
      # Strict on push (we are waiting for OUR deploy; anything else means the
      # checks below describe different code) and advisory on the daily cron,
      # where a skew usually means someone landed to main without deploying —
      # a real state worth reporting, not a reason to hide every other result
      # behind one red step.
      #
      # Comparison logic lives in scripts/wait-for-deploy.ts with tests
      # (src/__tests__/unit/wait-for-deploy.test.ts), because a gate that is
      # wrong in the permissive direction turns this whole suite into a
      # confident report about code nobody deployed.
      #
      # First run after this lands: the build then serving predates the
      # /health commit field and reports null, which is "cannot tell" and not
      # a match — so the gate keeps waiting rather than passing. The deploy it
      # is waiting for is the one carrying this change, which does report a
      # commit, so it resolves as soon as that goes live (~3-5 min against a
      # 10 min budget). No intervention needed; it is only surprising if you
      # do not know why it is waiting.
      - name: The deployed build is this commit's build
        run: |
          npx tsx scripts/wait-for-deploy.ts \
            '${{ steps.cfg.outputs.url }}' \
            '${{ github.sha }}' \
            --timeout $(( ${{ steps.cfg.outputs.wait }} * 60 )) \
            ${{ github.event_name == 'push' && '--require-match' || '' }}

      - name: The app shell is served
        run: |
          URL='${{ steps.cfg.outputs.url }}'
          # --retry covers a single transient blip. Without it one timed-out
          # request killed the whole job under `bash -e`, which is how the
          # broken wait above surfaced as an opaque "exit code 28".
          BODY=$(curl -s --max-time 25 --retry 3 --retry-delay 5 --retry-connrefused "$URL/") || {
            echo "::error::/ could not be fetched at all (curl exit $?)"; exit 1; }
          echo "$BODY" | head -c 200
          echo "$BODY" | grep -qi '<!doctype html' \
            || { echo "::error::/ did not return the SPA shell"; exit 1; }

      - name: Demo deck is reachable and populated
        run: |
          URL='${{ steps.cfg.outputs.url }}'
          # `|| true` so a curl failure surfaces as a 000 we can report, rather
          # than killing the step under `bash -e` with an opaque exit code.
          CODE=$(curl -s -o /tmp/rails.json -w '%{http_code}' --max-time 25 --retry 3 --retry-delay 5 "$URL/api/demo/rails" || true)
          [ "$CODE" = "000" ] && { echo "::error::/api/demo/rails unreachable (no HTTP response)"; exit 1; }
          echo "HTTP $CODE"; cat /tmp/rails.json | head -c 400; echo
          # 404 = DEMO_MODE_ENABLED unset on the service.
          # 503 = config/demo-rails.json missing from the image.
          # Both shipped at once in v4.28.0 and produced an empty walkthrough.
          if [ "$CODE" = "404" ]; then
            echo "::error::/api/demo/rails 404 — DEMO_MODE_ENABLED is not set on this service"; exit 1
          fi
          if [ "$CODE" = "503" ]; then
            echo "::error::/api/demo/rails 503 — config/demo-rails.json is not in the image"; exit 1
          fi
          [ "$CODE" = "200" ] || { echo "::error::unexpected status $CODE"; exit 1; }
          COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/rails.json'))['cards']))")
          echo "cards: $COUNT"
          [ "$COUNT" -ge 1 ] || { echo "::error::deck served zero cards"; exit 1; }

      - name: Roster route exists (v4.28.0+)
        run: |
          URL='${{ steps.cfg.outputs.url }}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 --retry 3 --retry-delay 5 "$URL/api/teaching/roster" || true)
          echo "HTTP $CODE"
          # Auth-gated, so 401/403 is the healthy answer. 404 means the route is
          # absent, i.e. the deployed build predates the fix.
          #
          # Matched against an ALLOWLIST rather than `!= 404`: a 000 from an
          # unreachable host is also "not 404", so the old form reported a
          # network failure as a passing route.
          case "$CODE" in
            200|401|403) ;;
            404) echo "::error::/api/teaching/roster 404 — deployed build predates v4.28.0"; exit 1 ;;
            *) echo "::error::/api/teaching/roster returned $CODE — not a healthy answer"; exit 1 ;;
          esac

      - name: Progress degrades instead of 500ing
        run: |
          URL='${{ steps.cfg.outputs.url }}'
          CODE=$(curl -s -o /tmp/prog.json -w '%{http_code}' --max-time 25 --retry 3 --retry-delay 5 "$URL/api/progress/prod-smoke-probe" || true)
          echo "HTTP $CODE"; head -c 200 /tmp/prog.json; echo
          # A session id that cannot exist. Before the fix this threw a 500 when
          # the store was unreachable; the honest answer is an empty shape.
          case "$CODE" in
            200|401|403|404) ;;
            500) echo "::error::/api/progress 500 — the degradation fix is not deployed"; exit 1 ;;
            *) echo "::error::/api/progress returned $CODE — not a healthy answer"; exit 1 ;;
          esac

      - name: Practice item route exists
        run: |
          URL='${{ steps.cfg.outputs.url }}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 --retry 3 --retry-delay 5 "$URL/api/practice/item/la-eigen-trace-det-001" || true)
          echo "HTTP $CODE"
          case "$CODE" in
            200|401|403) ;;
            404) echo "::error::/api/practice/item 404 — deployed build predates the graded-item work"; exit 1 ;;
            *) echo "::error::/api/practice/item returned $CODE — not a healthy answer"; exit 1 ;;
          esac

      # ── Does a STUDENT actually receive the content? ────────────────────
      #
      # Everything above this point asks whether a route answers. v4.43.0
      # showed that is not the same question: 606 authored stance variants
      # shipped, every gate went green, the readiness report counted them on
      # disk and said 101/101, and no real student could reach one of them.
      # Existence and delivery are different facts and only one of them had a
      # check.
      #
      # Assertions live in scripts/smoke-stance.ts as a pure function with
      # tests (src/__tests__/unit/smoke-stance.test.ts), for the same reason
      # the wait loop was moved out of this file: pass/fail logic buried in a
      # workflow step is logic nothing can test, and this repo has already
      # shipped one of those that was wrong in exactly the case it existed for.
      - name: Students receive stance-adapted content
        run: npx tsx scripts/smoke-stance.ts '${{ steps.cfg.outputs.url }}'

      # Every check above would pass against a build whose JavaScript throws
      # on load: a broken bundle still returns `<!doctype html>` with HTTP 200
      # while the student sees a blank page.
      # Installed into the workspace rather than run through `npx --package`:
      # smoke-browser.mjs is ESM and `import 'playwright'` resolves from
      # ./node_modules, which npx's temporary prefix is not on. The npx form
      # fails with MODULE_NOT_FOUND — caught by running it locally rather than
      # by a first red run here.
      # --no-save keeps package.json untouched; this job never runs npm ci.
      - name: Install Playwright + Chromium for the render check
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: The app boots in a real browser
        run: node scripts/smoke-browser.mjs '${{ steps.cfg.outputs.url }}'

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production smoke — ${{ steps.cfg.outputs.url }}"
            echo ""
            echo "Checks discriminate old build vs new, not just liveness:"
            echo "- \`/health.commit\` matching this commit proves THIS build is live, not the previous one"
            echo "- \`/api/demo/rails\` populated proves the flag is set AND config/ is in the image"
            echo "- \`/api/teaching/roster\` healthy proves the v4.28.0 route shipped"
            echo "- \`/api/progress/...\` not-500 proves the degradation fix shipped"
            echo "- stance probes prove a STUDENT receives adapted content, not just that files exist"
            echo "- the browser render check proves the bundle boots, which HTTP 200 does not"
            echo ""
            echo "Every status is matched against an allowlist, so an unreachable host"
            echo "fails instead of passing as \"not a 404\"." 
          } >> "$GITHUB_STEP_SUMMARY"
