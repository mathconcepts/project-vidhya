# Opted into the stance rollout. This is the top-level signal the
# content-maturity report reads; the per-atom-type `stances:` guidance below
# is authoring instruction and deliberately cannot double as it (every
# template carries that guidance, so it would opt every topic in at once).
#
# Opted in because the topic is genuinely finished: all 6 of its concepts
# carry a shaken and an assured body for every narrative atom type they have.
stances:
  rollout: authored
  variants: [shaken, assured]

topic_family: transform-theory

intuition:
  scaffold: domain-swap
  guidance: |
    Say what becomes easy in the new domain before defining the integral.
    Differentiation becomes multiplication; convolution becomes a product.
    The transform is a change of workspace, not a new kind of number.
  bloom_floor: 2

  stances:
    shaken: |
      Take one differential equation, transform it, and show the algebra
      collapse into a product in the new domain — one concrete instance
      before naming the general trade of derivatives for multiplication.
    assured: |
      The region of convergence is where the marks are. A transform stated
      without it is the error worth naming — lead with that, not with the
      domain-swap idea itself.

formal_definition:
  scaffold: integral-with-region
  guidance: |
    Give the defining integral or sum together with its region of convergence.
    A transform stated without its region is not yet a definition, and the
    region is where the exam marks are.
  bloom_floor: 3

worked_example:
  scaffold: transform-solve-invert
  guidance: |
    Transform, solve algebraically, invert. Show the partial fractions in
    full — that is where the work actually is. Six steps max, separated by
    `\n---\n`. Name the table entry used at each inversion.
  bloom_floor: 3

  stances:
    shaken: |
      Do the three moves — transform, solve, invert — as three separate
      visible lines, and show the partial fractions in full rather than
      compressing them; that expansion is where the actual work is. Name the
      table entry used for the inversion as its own line.
    assured: |
      Name the table entry and region needed for the inversion up front, and
      skip the partial-fraction expansion a confident reader can do
      mentally — but state explicitly whether the region survives the
      operation, since that is where marks are lost silently.

common_traps:
  scaffold: wrong-then-right
  guidance: |
    Common: dropping the region of convergence; forgetting the initial-value
    terms when transforming a derivative; inverting term by term across a
    boundary where the region changes; shift theorems applied in the wrong
    direction.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  guidance: |
    Table recall is legitimate here and worth drilling directly: pair each
    time-domain form with its transform and its region.
  bloom_floor: 2

visual_analogy:
  scaffold: pole-zero-plot
  guidance: |
    Pole-zero plots with the region of convergence shaded, beside the
    corresponding time-domain behaviour. Show how moving a pole changes the
    signal.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  guidance: |
    Mix Laplace, Fourier and Z problems so the student must pick the transform
    that suits the domain rather than applying the one most recently taught.
  bloom_floor: 4

hook:
  scaffold: when-naive-fails
  guidance: |
    Open with a differential equation solved in three algebraic lines after a
    transform. The contrast with solving it directly is the argument for the
    whole topic.
  bloom_floor: 1
  stances:
    shaken: |
      One differential equation solved in a handful of algebraic lines after
      the transform — show the lines themselves, not the argument for why
      transforms work in general.
    assured: |
      Name the one place a shift theorem gets applied in the wrong direction
      under exam pressure.
