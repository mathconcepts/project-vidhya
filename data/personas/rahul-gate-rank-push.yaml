schema_version: 1

# Rahul — GATE aspirant already scoring well, pushing for rank.
#
# The counterweight persona. The demo has to show that personalisation is not
# just remediation: the same concept, opened by someone who already has it,
# should not look like the same lesson. His mastery sits high enough that the
# useful move is depth and speed, not intuition-building — which is what makes
# the personalised-vs-neutral side-by-side worth looking at.
#
# This file describes a SCRIPTED demo persona. The id is a slug, not a UUID.
# Real student data MUST NOT be pasted here — CI invariant blocks UUIDs.

id: rahul-gate-rank-push
display_name: "Rahul — GATE aspirant, pushing for rank"
description: |
  Reliable on the standard linear-algebra questions and impatient with being
  walked through them again. Thinks in symbols first and only reaches for a
  picture when an answer surprises him. His risk is not the topic, it is
  spending revision time on what he already knows because it feels productive.

seed:
  representation_mode: algebraic
  motivation_state: driven
  knowledge_track_id: GATE-MA
  exam_id: gate-ma
  initial_mastery:
    eigenvalues: 0.81
    determinants: 0.88
    linear-transformations: 0.76
    orthogonality: 0.72
  recent_misconceptions:
    - m_skips_verification_step

answer_policy:
  type: scripted
  rules:
    # He rarely misses first time, and when he does it is a slip on a step he
    # considers beneath him rather than a gap in understanding.
    - on: first_exposure
      action: pick_distractor_kind
      kind: sign_slip
      probability: 0.15
    - on: default
      action: pick_correct
      probability_fn: mastery_plus_0_2
