# render.yaml -- Render Blueprint for the Vidhya demo
#
# Deploy via either:
#
#   1. One-click -- use the "Deploy to Render" button in README.md, which
#      opens https://dashboard.render.com/select-repo?type=blueprint
#      pre-pointed at this repo. Render reads this file and provisions
#      everything.
#
#   2. Manual -- in Render dashboard: New > Blueprint > connect this
#      repo > apply. Same result.
#
# What gets provisioned:
#   - 1 web service (Docker runtime, uses demo/Dockerfile)
#   - JWT_SECRET auto-generated (32 chars, unique per deployment)
#   - All LLM / Wolfram / Telegram keys marked sync:false so the Render
#     UI prompts the operator to paste them (or skip -- the demo works
#     without any of them at baseline)
#
# WHAT'S NEW SINCE THE LAST DEPLOY (deploy fresh to get):
#   - Syllabus Bridge framework: school curricula -> entrance exams,
#     /admin/syllabus-bridge wizard, /teacher/syllabus-coverage page,
#     bridge content card on /planned. NO new env vars required.
#   - Knowledge tracks at /knowledge: students pick board+grade+subject
#     and we map to suggested exams. NO new env vars.
#   - prep_intent (board-focused / bridge / entrance-focused) shapes
#     content scoping; explicit goal picker at /knowledge step 4. NO new
#     env vars.
#   - GBrain retention scheduler (SM-2 spaced repetition) and performance
#     trajectory tracker. Auto-wired into after-each-attempt. Write to
#     .data/gbrain-retention.json and .data/gbrain-trajectory.json --
#     ephemeral on free tier. NO new env vars.
#
# PERSISTENCE NOTE (free tier):
#   Render's free tier does not support persistent disks. .data/ lives in
#   the container's ephemeral filesystem and resets when the service
#   restarts or spins down after inactivity. Flat-file stores affected:
#
#     .data/users.json
#     .data/exam-profiles.json
#     .data/syllabus-bridge-content.json     -- generated bridge content
#     .data/syllabus-bridge-batches.json     -- batch history
#     .data/syllabus-bridge-feedback.json    -- student/teacher ratings
#     .data/gbrain-retention.json            -- SM-2 schedule per student
#     .data/gbrain-trajectory.json           -- mastery point log
#     .data/student-models.json              -- GBrain student state
#
#   The Dockerfile CMD runs "npm run demo:seed" on every boot so the 6
#   demo users are always recreated fresh. For a demo this is fine -- each
#   restart gives a clean slate. For persistent state (bridge content
#   persists across restarts, retention scheduler memory survives, real
#   sign-ups accumulate), upgrade to the Starter plan ($7/month) and add:
#
#     disk:
#       name: vidhya-demo-data
#       mountPath: /app/.data
#       sizeGB: 1
#
#   under the service block. .data/ is the only path that needs to persist.
#
# First boot: npm run demo:seed && tsx src/server.ts
#   Seeds 6 demo users (Nisha/Arjun/Kavita/Priya/Rahul/Aditya).
#   Seed is idempotent (upsert-by-google-sub) so re-running is safe.

services:
  - type: web
    name: vidhya-demo
    runtime: docker
    plan: free
    dockerfilePath: ./demo/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # required
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      # Always show demo quick-access buttons on the sign-in page so admin
      # access works even when GOOGLE_OAUTH_CLIENT_ID is configured.
      - key: VIDHYA_DEMO_MODE
        value: "true"
      # The visitor-facing walkthrough deck at /demo. A SEPARATE flag from
      # VIDHYA_DEMO_MODE on purpose: that one means "show quick-access sign-in
      # buttons" and defaults on whenever OAuth is unconfigured, so inheriting
      # it would expose the deck on every OAuth-less deployment. This service
      # is the demo, so it opts in explicitly.
      #
      # Without this the deck is reachable but empty: /api/demo/rails 404s and
      # the page reads "Demo mode is off on this instance" — which is what a
      # visitor to vidhya-demo.onrender.com was getting.
      - key: DEMO_MODE_ENABLED
        value: "true"
      # The intent lanes (T4): the Definite Problem Statement block and the
      # intent-ordered atom sequence on mapped Linear Algebra concept pages.
      # Read at src/api/auth-routes.ts and served DB-less-safe through
      # /api/auth/config, so the frontend gates every T4 surface off one flag.
      #
      # Committed here rather than set in the Render UI on purpose: a flag
      # that lives only in a dashboard survives nobody's memory and does not
      # survive service recreation, which is exactly how this work shipped and
      # then sat dark. Rollback stays one env-var change. `ci:demo-rails`
      # asserts this stays "on" so the flag cannot go dark unnoticed again.
      - key: VIDHYA_INTENT_LANES
        value: "on"

      # ── AI tutor (STEP 1: paste one key to unlock AI chat) ──────────────
      # Get a free Gemini key at https://aistudio.google.com/apikey
      # Without any key: demo, plans, and exam content all work; only AI chat is disabled.
      - key: GEMINI_API_KEY
        sync: false
      # Alternatives to Gemini (pick any one; Gemini recommended for free tier):
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Override which provider is primary (default: auto-detect from key present):
      - key: VIDHYA_LLM_PRIMARY_PROVIDER
        sync: false

      # ── Maths verification (STEP 2: optional, improves answer accuracy) ─
      # Free key at https://products.wolframalpha.com/api
      - key: WOLFRAM_APP_ID
        sync: false

      # ── Analytics (optional: see how students use the app) ───────────────
      # Free PostHog account at https://posthog.com — paste your host URL here
      - key: POSTHOG_HOST
        sync: false

      # ── Channel delivery (optional: Telegram / WhatsApp bots) ────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      # ── GATE Math specific (optional) ────────────────────────────────────
      # Which exam to serve (default: gate-ma). Other values: jee-main, neet, etc.
      - key: DEFAULT_EXAM_ID
        sync: false
      # Supabase database (optional: enables GBrain student model persistence)
      #
      # Use the SESSION-mode pooler string (port 5432, not the 6543
      # transaction-mode one — advisory locks break silently under it, see
      # docs/ops/render-database-url.md) and end it with `?sslmode=require`.
      # Without an sslmode the driver opens a plaintext connection and the
      # pooler refuses it; with it, verification succeeds thanks to
      # NODE_EXTRA_CA_CERTS below.
      - key: DATABASE_URL
        sync: false
      # Trust Supabase's root CA so `sslmode=require` verifies rather than
      # erroring on the chain. Node reads this at process start and adds the
      # file to its default trust store, so every pg.Pool in the process gets
      # it without any per-module ssl config. The certificate ships in the
      # image (certs/, copied by demo/Dockerfile) and is public material.
      - key: NODE_EXTRA_CA_CERTS
        value: /app/certs/supabase-prod-ca-2021.crt
      - key: SUPABASE_DB_URL
        sync: false
