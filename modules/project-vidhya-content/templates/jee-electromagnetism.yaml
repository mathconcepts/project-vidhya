# Best-practice authoring templates for JEE Main Electromagnetism concepts
# (electrostatics-coulomb, capacitance, current-electricity, magnetic-effects,
# electromagnetic-induction, alternating-current, electromagnetic-waves).
#
# NO top-level `stances:` opt-in key on this file, on purpose — see
# jee-mechanics.yaml's header for the full rationale.
#
# Audience note: an anxious Indian Class 11-12 student sitting JEE Main.
# ELI5, short sentences, Indian English, every technical term glossed on
# first use. No curriculum-bridge audit exists for Physics against any state
# board, so treat this as first-time-depth instruction, not a refresher.
#
# Family shape (field_and_circuit): intuition sets up the physical
# configuration, formalism states the governing law, worked_example is a
# numeric problem, practice checks a sign convention. The one thing this
# template insists on that no other family's guidance quite captures: draw
# the circuit diagram or field configuration (with every component, current
# direction, and field direction labelled) BEFORE writing the governing law,
# and state the sign convention (current direction relative to an assumed
# loop, the direction of an induced emf via Lenz's law, positive vs negative
# terminal) explicitly — this is where JEE Main electromagnetism marks are
# actually lost, not in the algebra.

topic_family: jee-electromagnetism

intuition:
  scaffold: configuration-before-formula
  guidance: |
    Open by describing the physical configuration in plain words — two
    charged spheres a distance apart, a loop of wire near a moving magnet, a
    battery driving current through a network of resistors — and sketch it
    in words (label which way current flows, which plate is positive)
    before any equation appears. Gloss every technical word on first use
    (e.g. "electric flux" — a way of counting how many field lines pass
    through a surface, not the field itself). Only once the configuration is
    fixed should the general law appear.
  bloom_floor: 2

  stances:
    shaken: |
      Skip the general statement. Pick one small, fully-numbered
      configuration (two charges, one simple circuit, one wire in a field)
      and work through what happens — direction and magnitude — by hand,
      before any symbol appears in general form. End on one thing to do
      next time (e.g. "always assume a current direction first, then let
      the sign of the answer tell you if you guessed right"), phrased as an
      action. No praise, no mention of feelings.
    assured: |
      Skip the setup — a confident reader already draws the circuit or
      field diagram automatically. Go straight to the one condition that
      costs marks: a sign flipped in Lenz's law, a component resolved along
      the wrong direction in a magnetic-force problem, or an assumption
      (ideal cell, no internal resistance) a shortcut silently needs. Give a
      genuine counterexample, not a restatement.

formal_definition:
  scaffold: law-with-sign-convention
  guidance: |
    State the law in full symbolic form with display math (Coulomb's law,
    Ohm's law, Faraday's law), name the SI unit of every quantity, and state
    the sign or direction convention in the same sentence — for induction
    laws in particular, state explicitly which direction counts as positive
    flux before giving the minus sign its meaning. Two-sentence prose cap
    around the display math. Name every symbol once in plain words on first
    use.
  bloom_floor: 3

worked_example:
  scaffold: diagram-then-numbers
  guidance: |
    Start with a one-line description of the circuit or field diagram
    (which components, which directions are assumed positive) before any
    number is substituted. Six steps maximum, each step one action (draw
    the diagram, write the governing law or circuit equation, substitute
    values with units, solve, sanity-check the sign or direction of the
    answer against the physical picture). Favour a JEE-flavoured shape (a
    Wheatstone bridge, a rod sliding on rails in a magnetic field, an LCR
    circuit at resonance) over a bare plug-in-the-formula problem. Steps
    separated by `\n---\n`. Final line "Answer: ..." with its unit.
  bloom_floor: 3

  stances:
    shaken: |
      One action per step, no exceptions — draw, write the law, substitute,
      solve, check, each on its own line. Push every "why" into the
      walkthrough's prompts/hints. End with the check run explicitly (does
      the direction or sign of the answer match the physical picture), not
      just claimed.
    assured: |
      Lead with the shortcut a first pass doesn't always emphasise —
      symmetry to eliminate a field component before integrating, or
      recognising a balanced Wheatstone bridge to skip a branch entirely —
      and state the one condition that must hold for the shortcut to apply
      before using it.

common_traps:
  scaffold: wrong-then-right
  guidance: |
    Two to three trap pairs, each: the wrong move, the right move, and one
    line on why the wrong move feels natural. Favour traps specific to
    JEE-level electromagnetism: getting the direction of induced current
    backwards by forgetting Lenz's law opposes the CHANGE in flux (not the
    flux itself), mixing up series and parallel formulas for capacitors
    versus resistors (they're opposite in shape), or using peak values
    where rms values are needed in an AC power calculation.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  guidance: |
    One fast question, same shape as the worked_example but with different
    numbers. Keep the arithmetic small enough to finish in under a minute —
    round resistances, simple whole-number charge or current values.
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  guidance: |
    Front asks for the law by name (e.g. "Faraday's law", "Biot-Savart
    law"); back gives the symbolic form and the one condition or sign
    convention it needs. Used by SM-2 spaced repetition.
  bloom_floor: 2

visual_analogy:
  scaffold: circuit-or-field-picture
  guidance: |
    Describe the circuit or field configuration as a labelled picture in
    words (field lines radiating out from a positive charge, current
    looping through a labelled network) — this concept family is almost
    entirely about configuration, not a plottable curve.

    An alternating-current waveform is the one genuine exception: the
    current or voltage in an AC circuit, I(t) = I0*sin(omega*t), is a real
    fit for `function-trace` or `parametric`. For any other concept in this
    family, OMIT the gif-scene block entirely rather than force one —
    circuit topology and field-line diagrams do not reduce to the safe
    single-variable formula the renderer evaluates, and inventing a
    misleading plot is worse than no visual at all. Schema, when it
    genuinely applies:

    ```gif-scene
    {"type":"function-trace","expression":"5*sin(6.28*x)","x_range":[0,2],"y_range":[-6,6],"frames":30,"fps":12}
    ```

    Allowed expression tokens: x, t, +, -, *, /, ^, parens, numbers, and
    sin/cos/tan/log/ln/exp/sqrt/abs/pi/e.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  guidance: |
    One representative JEE Main stem (MCQ or numerical-value) with a
    one-line "when you see this phrasing, do X" cue — e.g. "when the
    question says 'the switch is opened', check for an EMF from the
    collapsing magnetic field before assuming current stops instantly."
    JEE Main Paper 1 asks 25 questions per subject: 20 MCQs (+4/-1) and 5
    compulsory numerical-value questions — do not invent a per-topic
    weightage beyond that.
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  guidance: |
    A short, memorable line for a rule that's easy to mix up (the
    right-hand rule for the direction of a magnetic field around a current,
    which formula is for capacitors in series vs parallel versus resistors
    in series vs parallel).
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  guidance: |
    Three problems mixing two related ideas from this concept family (e.g.
    a magnetic-effects question about the force on a wire feeding into an
    electromagnetic-induction question about the EMF induced when that same
    wire moves).
  bloom_floor: 4

hook:
  scaffold: what-does-the-meter-read
  guidance: |
    Open on one concrete, fully-numbered configuration small enough to
    picture immediately. Name the JEE-specific twist up front (e.g. "you
    pull a magnet OUT of a coil instead of pushing it in — does the induced
    current reverse direction too?").

    Fuse the hook into a scripted beat sequence rather than a static
    sentence: emit a fenced interactive-spec block at the end of the body
    (mirrors the gif-scene pattern used under visual_analogy). Schema:

    ```interactive-spec
    {"v":1,"kind":"simulation","title":"...","x_expr":"...","y_expr":"...",
     "t_min":0,"t_max":1,
     "narration_steps":[
       {"at_progress":0,"text":"..."},
       {"at_progress":0.5,"text":"...","trap":{"text":"what students get wrong","avoid":"the one-line fix"}}
     ],
     "ghost":{"x_expr":"...","y_expr":"..."}}
    ```

    3-5 narration_steps beats, synced to at_progress (0..1). Exactly ONE
    beat carries a "trap" — weave it from this concept's authored
    common-traps.md, not a fresh guess. Reserve this fence for a genuine
    waveform (alternating-current is the one strong fit in this family).
    OMIT the fence entirely for a circuit or field configuration that
    doesn't reduce to a 2D parametric/trace scene — never invent a
    misleading scene.
  bloom_floor: 1
  stances:
    shaken: |
      One concrete, fully-numbered instance, small enough to picture right
      now. No history, no "you'll need this later" framing — the reader is
      here after getting something wrong, and the useful move is one thing
      that works immediately.
    assured: |
      Name the exact JEE phrasing this concept hides behind, and the one
      shortcut students reach for under time pressure that silently fails
      (assuming a wire's resistance is negligible when the question gives
      it explicitly, or forgetting a capacitor blocks DC in steady state).
