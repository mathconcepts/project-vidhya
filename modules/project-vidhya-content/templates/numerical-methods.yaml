topic_family: numerical-methods

intuition:
  scaffold: exact-vs-computable
  guidance: |
    Start from a problem with no closed form, or one too expensive to solve
    exactly, and show the approximation as the response. Every method here is
    a trade of exactness for tractability; name what is being traded.
  bloom_floor: 2

  stances:
    shaken: |
      Pick one problem with no closed form — a root, an integral — and show
      the approximation actually being computed for one small step, before
      naming the general trade being made. Let the number appear before the
      abstraction of "exactness for tractability" does.
    assured: |
      Skip the motivation and name the convergence condition first — a
      method applied outside it is the single most common way to get a
      confident wrong answer, and that is the fact worth stating plainly.

formal_definition:
  scaffold: iteration-with-conditions
  guidance: |
    Give the iteration or formula, its convergence condition, and its error
    order. All three, in that order. A method quoted without its convergence
    condition is the most common way to get a wrong answer confidently.
  bloom_floor: 3

worked_example:
  scaffold: tabulated-iterations
  guidance: |
    Table of iterations with the value and the error at each step, so the
    convergence rate is visible rather than asserted. Six steps max, separated
    by `\n---\n`. State the stopping criterion before starting.
  bloom_floor: 3

  stances:
    shaken: |
      Show the first two iterations in full with the error column visible,
      so convergence is something the reader watches happen rather than
      something asserted. State the stopping criterion as its own line
      before the table starts.
    assured: |
      State the convergence condition and the error order before touching
      the iteration — skip re-deriving the formula. If a bracketing interval
      is involved, confirm in one line that it actually brackets the root
      rather than assuming the setup was valid.

common_traps:
  scaffold: wrong-then-right
  guidance: |
    Common: applying a method outside its convergence condition; a bracketing
    interval that does not bracket a root; confusing absolute with relative
    error; carrying too few digits and blaming the method.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  bloom_floor: 2

visual_analogy:
  scaffold: convergence-plot
  guidance: |
    Show successive iterates converging on the axis, or the interpolating
    curve against the true function with the error band between them. Make
    the error the visible quantity.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  guidance: |
    Mix problems where a method converges with ones where it diverges or
    stalls. Checking the condition before applying the method is the skill
    being drilled.
  bloom_floor: 4

hook:
  scaffold: when-naive-fails
  guidance: |
    Open with an equation that has no algebraic solution and a calculator
    answer that is obviously close. The gap between "no solution exists" and
    "here is the number" is the point.
  bloom_floor: 1
  stances:
    shaken: |
      One equation with no algebraic solution, and the one number a
      calculator gets close to — nothing about the general method yet, just
      that gap.
    assured: |
      Name the exact convergence condition a method needs before it can be
      trusted, and the plausible-looking case where that condition silently
      fails.
