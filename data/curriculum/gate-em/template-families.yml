# ---------------------------------------------------------------------------
# Template families — the demand-side "package anatomy" (W2.1, PR content-
# readiness-market-research-integration §4 W2, amendment E11).
#
# Source: "Research-First Adaptive Content-Generation Framework for GATE
# Engineering Mathematics" §7.2 ("Template families for all topics") and its
# companion "GATE atomic content structure map" (the 116-topic base_sequence
# table), both part of the 177-file market-research corpus reviewed
# 2026-08-27. The 14 families and their per-family base_sequence strings
# (the `source_sequence` field on every family below) are copied verbatim
# from that table.
#
# design_hypothesis (§2 preamble of the plan doc, binding on this file):
# the family SHAPES (which pedagogical steps exist, in what order) are
# imported as-is because the corpus's own reasoning for them (chunking,
# worked examples, retrieval — cited to Sweller/Roediger-family literature)
# is sound instructional-design practice. The specific STAGE→AtomKind
# translation below, and every `presentation` hint, is this repo's own
# judgment call translating that shape into the LOCKED blueprint vocabulary
# (src/blueprints/types.ts StageKind / AtomKind) — introducing NO new
# runtime enums, mirroring intent-profiles.yml's own header discipline.
# Nothing here is measured demand or a validated pedagogical result; it is
# a starting hypothesis pending lift data, exactly like intent-profiles.yml's
# default_stage_sequence values already are.
#
# Three families (ode, optimization, vector) get an extra `discovery` /
# guided_walkthrough / decision_tree stage where the source's own sequence
# names a genuine method-selection decision point (`method_decision_tree`,
# `method_selection`, `theorem_or_identity_check`) — P2b already shipped a
# branching guided_walkthrough for the vector-family case (VC-11, "Green,
# Stokes or Gauss?"), so `vector` here is consistency with shipped product,
# not speculation. The other 11 families collapse to the simpler
# intuition → formalism → worked_example → practice shape; the source's
# `recall_prompt` / `mode_variant` / `timed_check` closing steps fold into
# the practice stage (see each family's `source_sequence` for the un-folded
# original — nothing from the source sequence is dropped, only consolidated
# onto the 6 locked StageKinds).
#
# `presentation` hints are documentary metadata for content authors + future
# renderers, exactly like intent-profiles.yml's `property_card` /
# `decision_tree` hints — scripts/generate-intent-tables.ts strips them
# before they reach BlueprintDecisionsV1 (that locked contract must never
# carry a presentation field; see src/blueprints/types.ts's header). Every
# value used below is declared in `presentation_vocabulary` so a typo is a
# CI failure (check-intent-catalogue.ts B10), not a silent drift.
#
# Coverage below maps every concept in the concept graph
# (src/constants/concept-graph.ts, 170 concepts / 25 topics across the
# gate-ma and jee-main packs) onto exactly one of these 24 families — `coverage.topic_defaults` (7 topics whose
# concepts are family-homogeneous) plus `coverage.concept_overrides` (34
# concepts split across families or belonging to a "cluster" the source
# table treats specially, e.g. the eigen-decomposition cluster inside
# linear-algebra). `calculus` and `transform-theory` have NO topic default —
# both topics genuinely span multiple families in the source table, so
# every concept in them is listed explicitly. `graph-theory` and
# `transform-theory`'s `z-transform` have no direct entry in the 116-topic
# corpus (which stops at GATE-EM's own scope); their family assignment is
# this file's own extrapolation, called out inline below — never presented
# as a corpus-sourced mapping. `optimization` currently has ZERO concepts
# mapped (Vidhya's calculus topic has no multivariable-constrained-
# optimization concept yet; the source table's own multivariable-only
# optimization family — single-variable maxima/minima uses `derivative`,
# see the `maxima-minima` line below — would apply if one is added later).
# check-intent-catalogue.ts's B12 completeness check does not require every
# family to have coverage, only that every concept has exactly one.
#
# schema_version 1 is locked, mirroring intent-profiles.yml. Shape changes
# ship as schema_version 2.
# ---------------------------------------------------------------------------
schema_version: 1
id: gate-em-template-families

source: >
  Research-First Adaptive Content-Generation Framework for GATE Engineering
  Mathematics, §7.2 "Template families for all topics"; GATE atomic content
  structure map (116-topic base_sequence table). Market-research corpus,
  reviewed 2026-08-27.

note: >
  Every family's stage sequence is a design_hypothesis (W1.2/E10 evidence
  discipline) — a plausible pedagogical ordering pending lift data, not a
  validated fact. Treat as a starting default for the template engine, to
  be A/B'd like any other blueprint decision once real students exist
  (activation gate, §7 of the plan doc).

