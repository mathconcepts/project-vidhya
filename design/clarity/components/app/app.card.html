<!-- @dsCard group="Components" viewport="700x380" subtitle="Task card, rings, receipts, tabs, tutor" name="App surfaces" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>App components</title>
<link rel="stylesheet" href="../../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
body{padding:20px}
</style></head><body>
<div class="row" style="align-items:flex-start;gap:16px">
  <div style="flex:1;min-width:300px;background:var(--surface-card);border-radius:28px;padding:24px;box-shadow:var(--shadow-card)">
    <p style="margin:0;font:400 13px var(--font-sans);color:var(--text-secondary)">Your next move</p>
    <h2 style="margin:6px 0 0;font:700 34px var(--font-sans);letter-spacing:-.022em;line-height:1.08">Linear Algebra</h2>
    <p style="margin:10px 0 0;font:400 15px var(--font-sans);color:var(--text-secondary)">Biggest area to grow · 34 days to go</p>
    <button style="margin-top:18px;width:100%;height:52px;border:none;border-radius:16px;background:var(--green);color:#fff;font:600 17px var(--font-sans);cursor:pointer">Start practising</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:0.5px solid var(--separator);font:400 13px var(--font-sans);color:var(--text-secondary)">
      <span>2 of 4 today</span>
      <span style="display:flex;gap:6px">
        <span style="padding:8px 12px;border-radius:8px;background:var(--surface-fill);font:600 12px var(--font-sans);color:var(--text-primary)">Done</span>
        <span style="padding:8px 12px;border-radius:8px;background:var(--surface-fill);font:600 12px var(--font-sans);color:var(--text-primary)">Okay</span>
        <span style="padding:8px 12px;border-radius:8px;background:var(--surface-fill);font:600 12px var(--font-sans);color:var(--text-primary)">Hard</span>
      </span>
    </div>
  </div>
  <div class="col" style="flex:0 0 300px;gap:12px">
    <div class="row" style="gap:14px;align-items:center">
      <svg width="64" height="64" style="transform:rotate(-90deg)"><circle cx="32" cy="32" r="29" fill="none" stroke="var(--surface-fill)" stroke-width="5"/><circle cx="32" cy="32" r="29" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="182" stroke-dashoffset="51"/></svg>
      <div><div style="font:600 22px var(--font-sans);font-variant-numeric:tabular-nums">72%</div><div class="lbl">Exam readiness</div></div>
      <div style="width:56px;height:56px;border-radius:999px;background:var(--indigo);box-shadow:var(--shadow-fab);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px">◆</div>
    </div>
    <div style="border-radius:12px;padding:14px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--receipt-line)">
      <div style="display:inline-flex;align-items:center;gap:5px;font:600 12px var(--font-sans);color:var(--green-ink);margin-bottom:8px"><span style="width:15px;height:15px;border-radius:999px;background:var(--green);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center">✓</span> Verified · Wolfram</div>
      <div style="font:400 16px var(--font-sans)">The series converges for |x| &lt; 1.</div>
    </div>
    <div style="display:flex;justify-content:flex-end"><div style="max-width:82%;padding:10px 14px;border-radius:20px 20px 6px 20px;background:var(--indigo);color:#fff;font:400 16px var(--font-sans)">Why does this diverge?</div></div>
    <div style="display:flex;background:var(--material-thick);backdrop-filter:var(--blur-nav);border-top:0.5px solid var(--separator);border-radius:0 0 12px 12px">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;font:600 11px var(--font-sans);color:var(--indigo-ink)"><span style="font-size:18px">◉</span>Today</div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;font:500 11px var(--font-sans);color:var(--text-secondary)"><span style="font-size:18px">▤</span>Notes</div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;font:500 11px var(--font-sans);color:var(--text-secondary)"><span style="font-size:18px">◍</span>Progress</div>
    </div>
  </div>
</div>
</body></html>
