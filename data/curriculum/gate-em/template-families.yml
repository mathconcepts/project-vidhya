  # --- Families below extend BEYOND the 116-topic GATE-EM corpus ----------
  # The fourteen families above are derived from the founder's GATE
  # Engineering Mathematics content-generation spec. That corpus is a
  # postgraduate engineering-maths syllabus, so by construction it contains
  # no coordinate geometry, no school trigonometry and no school-level
  # algebraic manipulation. When the jee-main pack promoted its 23
  # Mathematics concepts into the concept graph, three whole subject areas
  # arrived with no honest family to land in.
  #
  # Forcing conic sections into `vector`, or quadratic equations into
  # `matrix`, would have satisfied the B12 completeness check while
  # describing a teaching shape those concepts do not have. These three are
  # this repo's own extrapolation, in the same spirit as the `z-transform`
  # note further down and labelled as such here: never presented as a
  # corpus-sourced mapping.

  coordinate_geometry:
    label: Coordinate Geometry
    hooks: [locus_before_equation, geometric_condition_made_algebraic]
    source_sequence: "hook -> locus_picture -> standard_form -> worked_locus -> condition_or_tangency_check -> recall_prompt -> mode_variant"
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: locus_picture }
      - { id: formalism,      atom_kind: worked_example,       presentation: standard_form }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_locus }
      - { id: practice,       atom_kind: mcq,                  presentation: condition_or_tangency_check }

  trigonometry:
    label: Trigonometry
    hooks: [unit_circle_intuition, angle_before_identity]
    source_sequence: "hook -> unit_circle_visual -> identity_or_transformation -> worked_solution -> domain_or_branch_check -> recall_prompt -> mode_variant"
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: unit_circle_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: identity_or_transformation }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_solution }
      - { id: practice,       atom_kind: mcq,                  presentation: domain_or_branch_check }

  algebra:
    label: Algebra
    hooks: [small_numeric_case_first, pattern_before_formula]
    source_sequence: "hook -> small_numeric_case -> structural_rule -> worked_manipulation -> boundary_or_count_check -> recall_prompt -> mode_variant"
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: small_numeric_case }
      - { id: formalism,      atom_kind: worked_example,       presentation: structural_rule }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_manipulation }
      - { id: practice,       atom_kind: mcq,                  presentation: boundary_or_count_check }

  # --- Physics and Chemistry families -------------------------------------
  #
  # The 17 families above come from the founder's 116-topic GATE ENGINEERING
  # MATHEMATICS corpus. That corpus is postgraduate engineering maths, so by
  # construction it contains no mechanics, no reaction mechanisms and no
  # periodic trends — the JEE Physics and Chemistry subjects arrived with no
  # honest family to land in, exactly as coordinate geometry, trigonometry and
  # school algebra did when the JEE Mathematics pack landed.
  #
  # Filing a free-body-diagram concept under `vector`, or an organic
  # mechanism under `algebra`, would satisfy B12's completeness check while
  # describing a teaching shape those concepts do not have. These seven are
  # APPENDED (never interleaved, so the corpus families keep their source
  # order) and are labelled as this repo's own extrapolation — there is no
  # `source_sequence` line on them because no source sequence exists to cite,
  # which is the honest form of that field's absence.
  #
  # Each earns its place by a genuinely different shape, not by subject label:
  # `mechanics` and `field_and_circuit` both set up a physical situation
  # before any formula, but one resolves it with a free-body diagram and the
  # other with a circuit/field configuration; `chemistry_reaction` is the only
  # family whose formalism stage is a MECHANISM rather than an equation, which
  # is why organic chemistry cannot share `chemistry_quantitative`'s shape.

  mechanics:
    label: Mechanics
    hooks: [physical_situation_first, predict_the_motion]
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: physical_setup_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: free_body_diagram }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_numeric_problem }
      - { id: practice,       atom_kind: mcq,                  presentation: sign_or_units_check }

  field_and_circuit:
    label: Field and Circuit
    hooks: [configuration_before_formula, what_does_the_meter_read]
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: physical_setup_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: law_statement }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_numeric_problem }
      - { id: practice,       atom_kind: mcq,                  presentation: sign_convention_check }

  wave_and_optics:
    label: Wave and Optics
    hooks: [path_difference_story, ray_or_wavefront_picture]
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: geometric_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: law_statement }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_numeric_problem }
      - { id: practice,       atom_kind: mcq,                  presentation: sign_convention_check }

  modern_physics:
    label: Modern Physics
    hooks: [experiment_that_broke_the_old_model, quantised_not_continuous]
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: data_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: law_statement }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_numeric_problem }
      - { id: practice,       atom_kind: mcq,                  presentation: numeric_substitution_check }

  chemistry_quantitative:
    label: Chemistry (Quantitative)
    hooks: [count_before_formula, what_is_conserved]
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: quantitative_setup }
      - { id: formalism,      atom_kind: worked_example,       presentation: rule_or_theorem }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_stoichiometry }
      - { id: practice,       atom_kind: mcq,                  presentation: numeric_substitution_check }

  chemistry_structure:
    label: Chemistry (Structure and Periodicity)
    hooks: [structure_explains_property, exception_first]
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: structure_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: periodic_trend_visual }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_structure }
      - { id: practice,       atom_kind: mcq,                  presentation: trend_or_exception_check }

  chemistry_reaction:
    label: Chemistry (Reactions and Mechanisms)
    hooks: [where_do_the_electrons_go, same_reagent_different_product]
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: structure_visual }
      - { id: discovery,      atom_kind: guided_walkthrough,   presentation: decision_tree }
      - { id: formalism,      atom_kind: worked_example,       presentation: mechanism_arrows }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_synthesis }
      - { id: practice,       atom_kind: mcq,                  presentation: product_prediction_check }

# ---------------------------------------------------------------------------
# Coverage — maps every concept-graph concept (src/constants/concept-graph.ts)
# onto exactly one family above. Resolution order: concept_overrides wins;
# otherwise topic_defaults[concept.topic]. A concept in a topic with no
# topic_default MUST appear in concept_overrides (calculus, transform-theory)
# — enforced by check-intent-catalogue.ts's B12 completeness check.
# ---------------------------------------------------------------------------
coverage:
  topic_defaults:
    linear-algebra: matrix
    vector-calculus: vector
    differential-equations: ode
    complex-variables: complex
    probability-statistics: probability
    numerical-methods: numerical
    discrete-mathematics: discrete
    # graph-theory has no direct family in the source table; the corpus's
    # own discrete-mathematics family (DM-10 graph connectivity, DM-11
    # matching, DM-12 graph colouring) already covers graph topics under
    # `discrete` — extrapolated as the topic default for the rest of
    # Vidhya's graph-theory concepts (graph_basics, trees, euler_hamilton,
    # planar_graphs, shortest_paths) on the same "small puzzle" hook.
    graph-theory: discrete
    # jee-main pack. Three of its six topics are family-homogeneous; the
    # other three (jee-algebra, jee-calculus, jee-probability-statistics)
    # genuinely span families and are split concept-by-concept below, the
    # same treatment `calculus` and `transform-theory` already get.
    jee-coordinate-geometry: coordinate_geometry
    jee-trigonometry: trigonometry
    jee-vectors-3d: vector
    # jee-main Physics and Chemistry. All nine topics are family-homogeneous:
    # each was carved as a section precisely because its concepts share a
    # teaching shape, so none needs a concept_overrides split. Two deliberate
    # cross-subject assignments: `jee-thermal-physics` sits on `mechanics`
    # (a gas law is set up and resolved the same way a pulley problem is, and
    # a separate two-concept family would be a label, not a shape), and
    # `jee-modern-physics` keeps `semiconductor-electronics` on the modern
    # family rather than `field_and_circuit` — its hook is the band model,
    # not a circuit configuration.
    jee-mechanics: mechanics
    jee-thermal-physics: mechanics
    jee-oscillations-waves: wave_and_optics
    jee-electromagnetism: field_and_circuit
    jee-optics: wave_and_optics
    jee-modern-physics: modern_physics
    jee-physical-chemistry: chemistry_quantitative
    jee-organic-chemistry: chemistry_reaction
    jee-inorganic-chemistry: chemistry_structure
    # calculus: NO default — the source splits it across limit / derivative
    #   / integral (and optimization, currently unused); every concept below.
    # transform-theory: NO default — splits across ode (Laplace) / pde
    #   (Fourier); every concept below.

  concept_overrides:
    # --- linear-algebra: eigen-decomposition cluster -----------------------
    # Matches the source table's own `eigen` family (LA-06..09: eigenvalues,
    # eigenvectors, symmetric-matrix properties, diagonalization) plus two
    # Vidhya concepts in the same eigen-decomposition family of ideas that
    # have no separate 116-topic entry (spectral_theorem, jordan_normal_form).
    # cayley-hamilton is DELIBERATELY left on the `matrix` default — the
    # source table places LA-10 "Cayley-Hamilton theorem" in `matrix`, not
    # `eigen`, despite the eigenvalue connection; fidelity to source wins.
    eigenvalues: eigen
    diagonalization: eigen
    symmetric-matrices: eigen
    spectral-theorem: eigen
    jordan-normal-form: eigen

    # --- differential-equations: pde exception ------------------------------
    pde-basics: pde

    # --- probability-statistics: statistics split ---------------------------
    # Matches PS-08/12/13/14 (median/mode, sampling theorems, correlation,
    # regression) → `statistics`; everything else in the topic stays on the
    # `probability` default (PS-01..07,09..11: axioms, counting, conditional
    # probability, random variables, mean/variance, the named distributions).
    hypothesis-testing: statistics
    regression-correlation: statistics
    sampling-distributions: statistics

    # --- calculus: full split (no topic default) ----------------------------
    # limit family (CA-01/02/04/15: limits, indeterminate forms, continuity,
    # two-variable limits/continuity):
    sequences: limit
    series: limit
    limits: limit
    continuity: limit
    # derivative family (CA-03/05..09/16..18: L'Hospital through directional
    # derivative — includes single-variable maxima/minima, CA-07, which the
    # source places in `derivative`, NOT `optimization`; optimization is
    # multivariable-constrained only, see CA-19/20):
    differentiability: derivative
    derivatives-basic: derivative
    chain-rule: derivative
    product-quotient-rule: derivative
    implicit-differentiation: derivative
    maxima-minima: derivative
    mean-value-theorems: derivative
    multivariable-calculus: derivative
    # integral family (CA-10..14/21/22: fundamental theorem through
    # double/triple integrals):
    integration-basics: integral
    integration-substitution: integral
    integration-by-parts: integral
    partial-fractions: integral
    definite-integrals: integral
    improper-integrals: integral
    multiple-integrals: integral

    # --- transform-theory: full split (no topic default) --------------------
    # Laplace transforms map onto the source's DE-14 ("Laplace transforms in
    # ODE solution"), which the table places in the `ode` family:
    laplace-transform: ode
    inverse-laplace: ode
    laplace-applications: ode
    # Fourier series maps onto PD-06 ("Fourier-series boundary
    # representation"), placed in `pde`; fourier-transform is the natural
    # generalisation of fourier-series and follows it into the same family.
    fourier-series: pde
    fourier-transform: pde
    # z-transform has NO entry in the 116-topic corpus (discrete-time
    # transforms are outside its GATE-EM scope). This repo's own
    # extrapolation: nearest kin to Laplace (same mechanical-steps shape —
    # recognize the transform, apply the table, verify), not a corpus claim.
    z-transform: ode

    # --- jee-algebra: full split (no topic default) -------------------------
    # Sets/relations/functions and counting are the `discrete` family's own
    # territory (small concrete case, then the structural rule). Matrices and
    # complex numbers land on the existing families that already own those
    # shapes. The remaining three are equation- and identity-manipulation,
    # which is the new `algebra` family above.
    sets-relations-functions: discrete
    permutations-combinations: discrete
    matrices-and-determinants: matrix
    complex-numbers-algebra: complex
    quadratic-equations: algebra
    binomial-theorem: algebra
    sequences-series: algebra

    # --- jee-calculus: full split (no topic default) ------------------------
    # Mirrors how the GATE `calculus` topic is split above.
    # continuity-differentiability-jee is ONE JEE concept where GATE has two
    # (`continuity: limit`, `differentiability: derivative`). It lands on
    # `derivative`, not `limit`, because the differentiation machinery (chain
    # rule, implicit and parametric differentiation) is the larger half of
    # what JEE actually asks under that unit. Noted rather than silent: a
    # reader who expected `limit` here should know it was a judgement.
    limits-jee: limit
    continuity-differentiability-jee: derivative
    applications-of-derivatives: derivative
    indefinite-integration: integral
    definite-integration: integral
    differential-equations-jee: ode

    # --- jee-probability-statistics: full split (no topic default) ----------
    # Same probability/statistics split the GATE topic gets above.
    probability-jee: probability
    statistics-jee: statistics
