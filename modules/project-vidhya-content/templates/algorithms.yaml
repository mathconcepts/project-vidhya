topic_family: algorithms

intuition:
  scaffold: trace-on-small-input
  guidance: |
    Walk through the algorithm on a 3-4 element input by hand. Show what
    state each step changes. Avoid Big-O until formal_definition.
  bloom_floor: 2

  stances:
    shaken: |
      Trace the smallest input where the behaviour is non-trivial — three or
      four elements — and update the state after each individual step, not
      after each pass through the loop. Let the invariant hold in front of the
      reader rather than being told it does.
    assured: |
      Skip the trace and go straight to the loop invariant: what has to stay
      true at the top of every iteration, and where the bound is off by one.
      Name the exact index at which a careless bound would first go wrong.

formal_definition:
  scaffold: pseudocode
  guidance: |
    Pseudocode in fenced code block. State invariant + termination + Big-O.
  bloom_floor: 3

worked_example:
  scaffold: trace-table
  guidance: |
    Trace through with a table showing variables at each step. Six steps max.
  bloom_floor: 3

  stances:
    shaken: |
      One row per step in the trace table, never per pass — a row that
      silently advances two steps reads as a step the reader was expected to
      fill in themselves. Keep invariant commentary out of the table and put
      it in the walkthrough's hints, where it unfolds on request.
    assured: |
      Go straight to the invariant and the termination argument; skip
      re-tracing steps a confident reader can run mentally. Name the loop
      bound precisely — the off-by-one is the actual trap here, not the
      algorithm's logic.

common_traps:
  scaffold: wrong-then-right
  guidance: |
    Common: off-by-one in loop bounds, wrong recursion base case,
    confusing time vs space complexity.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  bloom_floor: 2

visual_analogy:
  scaffold: state-diagram
  guidance: |
    For graph algos: ASCII graph + step-by-step coloring. For sorts:
    array snapshots after each pass.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  bloom_floor: 4

hook:
  scaffold: when-naive-fails
  bloom_floor: 1
  stances:
    shaken: |
      One tiny input, three or four elements, where the naive first guess
      already breaks — nothing about why yet, just the break.
    assured: |
      Name the exact input class where the naive approach's complexity blows
      up, not just that it becomes slow — the growth rate is the content,
      not the anecdote.
