# Concept anchors — vector-calculus
#
# ONE plain sentence per concept, rendered at the top of the first lesson
# card before any mathematics. Contract v1 (see
# docs/designs/2026-09-18-concept-anchor-and-rendering-agenda.md §4):
# <=30 words, concrete system, carries the bridge not a name-drop, no
# notation, no exam framing, true and direction-precise.
version: 1
topic: vector-calculus
concepts:
  divergence-curl:
    anchor: "A weather map's wind field lets forecasters check two things: is air piling up or draining away, and is it starting to spin — two independent warning signs, checked separately."
  gauss-divergence:
    anchor: "An electric field's total outward flow through any sealed surface exactly equals the charge trapped inside — engineers use this to find a hidden charge without tracing the field everywhere."
  greens-theorem:
    anchor: "An aircraft wing generates lift because air circulates around it — that circulation is measured either along the wing's edge, or by summing swirl across its surface; both totals agree."
  line-integrals:
    anchor: "Towing a boat along a river whose current shifts direction and strength at every bend needs more than force times distance — add up the push felt along the path."
  stokes-theorem:
    anchor: "A wind turbine's spin is measured either along the blade's rim, or by summing the swirl passing through the disk it sweeps — both give exactly the same answer."
  surface-integrals:
    anchor: "A solar panel catches the most sunlight facing the sun, less as it tilts — the power gathered follows the cosine of the tilt angle, dropping slowly, then sharply."
  vector-algebra-basics:
    anchor: "Two cranes lifting one load from different angles can't add their pulling forces like plain numbers — the combined force follows a parallelogram, smaller than the sum unless pulls align."
  vector-fields:
    anchor: "A weather map attaches an arrow — speed and direction together — to every point, unlike a temperature map's plain numbers; walk inland from the coast and the arrows swing."
