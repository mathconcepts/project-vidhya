# Concept anchors — linear-algebra
#
# ONE plain sentence per concept, rendered at the top of the first lesson
# card before any mathematics. Contract v1 (see
# docs/designs/2026-09-18-concept-anchor-and-rendering-agenda.md §4):
# <=30 words, concrete system, carries the bridge not a name-drop, no
# notation, no exam framing, true and direction-precise.
version: 1
topic: linear-algebra
concepts:
  cayley-hamilton:
    anchor: "A control engineer predicting how a system evolves over time needs its matrix exponential; Cayley-Hamilton turns that infinite series into a short, exact polynomial in the matrix alone."
  change-of-basis:
    anchor: "An aircraft's autopilot senses velocity in the plane's body frame but must fly a route in Earth coordinates; a change-of-basis matrix converts one reading into the other."
  determinants:
    anchor: "A robot arm's control software constantly checks one number, the determinant of its motion matrix; the instant it hits zero, the arm has lost a direction it can move in."
  diagonalization:
    anchor: "Two vibrating masses linked by a spring have equations tangled together; diagonalizing their system matrix swaps to new coordinates where each mass moves as if the other weren't there."
  eigenvalues:
    anchor: "Google's original ranking algorithm treats the web as one giant matrix and finds its dominant eigenvector — the one direction every page's importance settles into after repeated link-following."
  gram-schmidt:
    anchor: "A 3D camera is given a forward direction and a rough 'up' guess that isn't quite perpendicular; Gram-Schmidt straightens the up vector so the camera's axes stay at right angles."
  inner-product-spaces:
    anchor: "A spectrum analyzer measures how much bass a song carries as the inner product of its sound wave with a reference wave — the recipe that measures angle between arrows."
  jordan-normal-form:
    anchor: "A critically-damped shock absorber's motion has a decaying term plain eigenvectors can't explain; that term comes from the repeated-eigenvalue structure Jordan form falls back on when diagonalization runs short."
  least-squares:
    anchor: "A GPS receiver hears more satellites than it needs, and none quite agree because of tiny errors; least squares finds the one position that best fits every reading at once."
  linear-independence:
    anchor: "A quadcopter's four propellers must produce thrust combinations that are linearly independent; if two of them turn out to be duplicates, one direction of motion becomes impossible to control."
  linear-transformations:
    anchor: "A video game engine rotates or shears a 3D character by multiplying every one of its thousands of vertices by the same matrix — one operation moves the whole model."
  lu-factorization:
    anchor: "A structural-engineering program analyzing a bridge under fifty load cases factors the stiffness matrix into two triangular pieces once, then reuses it for every case instead of re-solving each time."
  matrix-inverse:
    anchor: "Encrypting a message multiplies its plain text by a scrambling matrix; decrypting multiplies by the inverse, which exists only when no two messages could ever scramble to the same result."
  matrix-norms:
    anchor: "Engineering simulation software checks one number, the condition number, before trusting its answer; a large value warns that a tiny input error could blow up into a wildly wrong result."
  matrix-operations:
    anchor: "A robot arm combines two joint rotations by multiplying their matrices; reverse the order and the hand lands somewhere different — shoulder-then-elbow is not the same motion as elbow-then-shoulder."
  null-space-column-space:
    anchor: "A robot arm with spare joints can move some of them without shifting its hand — that motion lives in the Jacobian's null space, letting engineers dodge obstacles mid-task."
  orthogonality:
    anchor: "Wifi and 4G split one signal across many frequency channels chosen to be orthogonal, so however they overlap in time, one channel's signal never leaks energy into another's."
  positive-definite-matrices:
    anchor: "A training algorithm checks whether the matrix describing its loss's curvature is positive definite; only then is it sure it landed in a dip, not on a saddle."
  quadratic-forms:
    anchor: "A GPS receiver's position error forms an ellipse, not a circle, because some directions are noisier than others; the quadratic form built from the error data sets that ellipse's shape."
  rank-nullity:
    anchor: "A spacecraft's sensors can measure some combinations of its internal state but are structurally blind to others; rank-nullity fixes exactly how much is measurable and how much stays permanently hidden."
  spectral-theorem:
    anchor: "PCA, used to compress datasets, finds a covariance matrix's eigen-directions; the spectral theorem guarantees those directions always come out mutually perpendicular with real spread values, for any dataset at all."
  svd:
    anchor: "A photo can shrink to a tenth of its file size and look right, because SVD ranks its structure by singular value; keep the largest few and discard the rest."
  symmetric-matrices:
    anchor: "A bridge's stiffness matrix is always symmetric because pushing point A and measuring the sag at B gives the same number as pushing B and measuring the sag at A."
  systems-of-equations:
    anchor: "An engineer writes Kirchhoff's laws for a circuit as one system of equations; solving it shows whether every current is uniquely fixed, several solutions work, or the wiring is impossible."
  trace:
    anchor: "A positive diagonal sum on a structure's system matrix guarantees its vibration grows instead of dying out — engineers rule a design out on that number, before computing any frequency."
  vector-spaces:
    anchor: "Mixing two songs adds their waveforms; raising the volume scales them — sound recordings obey the same addition-and-scaling rules as arrows, so the same algebra tools apply to both."
