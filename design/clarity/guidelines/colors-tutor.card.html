<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tutor indigo</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

</style></head><body>
<div class="row">
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#5856d6;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Indigo</div><div class="mono">--indigo</div><div class="mono">#5856d6</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#4b49bf;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Pressed</div><div class="mono">--indigo-press</div><div class="mono">#4b49bf</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#4340b5;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Ink (text)</div><div class="mono">--indigo-ink</div><div class="mono">#4340b5</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:rgba(88,86,214,0.12);box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Tint</div><div class="mono">--indigo-tint</div><div class="mono">rgba(88,86,214,0.12)</div></div>
</div>
</div>
<p class="lbl" style="margin-top:14px">No other surface may use indigo. It is how a student learns to spot guidance.</p>
</body></html>
