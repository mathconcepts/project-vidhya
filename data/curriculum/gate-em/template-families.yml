      - { id: formalism,      atom_kind: worked_example,       presentation: formal_condition }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_complex_example }
      - { id: practice,       atom_kind: mcq,                  presentation: path_or_singularity_check }

  probability:
    label: Probability
    hooks: [everyday_uncertainty_puzzle, count_before_calculate]
    source_sequence: "hook → sample_space_visual → definition_or_model → worked_probability → independence_or_condition_check → recall_prompt → mode_variant"
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: sample_space_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: definition_or_model }
      - { id: worked_example, atom_kind: worked_example,       presentation: worked_probability }
      - { id: practice,       atom_kind: mcq,                  presentation: independence_or_condition_check }

  statistics:
    label: Statistics
    hooks: [signal_hidden_in_data, prediction_versus_association]
    source_sequence: "hook → data_visual → definition_or_model → worked_statistic → interpretation_or_assumption_check → recall_prompt → mode_variant"
    stages:
      - { id: intuition,      atom_kind: visual_analogy,      presentation: data_visual }
      - { id: formalism,      atom_kind: worked_example,       presentation: definition_or_model }
