# Concept anchors — jee-inorganic-chemistry
#
# ONE plain sentence per concept, rendered at the top of the first lesson
# card before any mathematics. Contract v1 (see
# docs/designs/2026-09-18-concept-anchor-and-rendering-agenda.md §4):
# <=100 characters (~3 rendered lines at 375px), a concrete named system,
# carries the bridge not a name-drop, no notation, no exam framing, true
# and direction-precise.
#
# Audience: Class 11-12 students preparing for JEE Main Chemistry. An anchor
# here says what the idea DOES in a system the reader already knows about,
# never what the exam asks about it — the exam framing lives in each
# concept's own exam-pattern atom, and mixing the two is what made every
# earlier framing registry in this repo exam-shaped.
version: 1
topic: jee-inorganic-chemistry
concepts:
  periodic-table-trends:
    anchor: "Ships bolt on a reactive zinc block as a sacrificial anode, since it corrodes before the steel hull."
  p-block-elements:
    anchor: "Computer chips are cut from silicon wafers, a p-block element whose bonding differs from carbon."
  d-and-f-block:
    anchor: "A car catalytic converter uses transition metals switching oxidation states to clean up exhaust gas."
  coordination-compounds:
    anchor: "Haemoglobin carries oxygen in blood using one iron atom held inside a coordination complex."
