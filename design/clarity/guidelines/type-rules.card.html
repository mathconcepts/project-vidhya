<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type rules</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

</style></head><body>
<div class="col" style="gap:12px;font-size:var(--text-subhead)">
  <div><strong>One family.</strong> The system sans carries display through caption. No second UI face.</div>
  <div><strong>Weight before size.</strong> Promote with 600, not with +4px.</div>
  <div><strong>Tabular numbers everywhere a number can change.</strong> Scores, timers, counts.</div>
</div>
</body></html>
