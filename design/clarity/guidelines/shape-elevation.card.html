<!-- @dsCard group="Shape" viewport="700x220" subtitle="Hairlines carry structure; shadows barely exist" name="Elevation & material" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Elevation and material</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
.demo{width:180px;height:96px;border-radius:var(--radius-lg);background:var(--surface-card);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-secondary)}
</style></head><body>
<div class="row">
  <div class="col" style="gap:6px"><div class="demo" style="box-shadow:var(--shadow-raise)">raise</div><div class="mono">--shadow-raise</div></div>
  <div class="col" style="gap:6px"><div class="demo" style="box-shadow:var(--shadow-card)">card</div><div class="mono">--shadow-card</div></div>
  <div class="col" style="gap:6px"><div class="demo" style="background:var(--material-thick);backdrop-filter:var(--blur-nav);box-shadow:inset 0 0.5px 0 rgba(255,255,255,.6),0 -0.5px 0 var(--separator)">material</div><div class="mono">--material-thick + --blur-nav</div></div>
</div>
<p class="lbl" style="margin-top:14px">Only nav bars, tab bars and sheets use the material. Content never blurs.</p>
</body></html>
