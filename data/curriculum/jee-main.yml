metadata:
  id: jee-main
  name: JEE Main (PCM)
  conducting_body: NTA (National Testing Agency)
  year_effective_from: 2024
  syllabus_source_url: https://jeemain.nta.nic.in/syllabus/
  description: >
    Joint Entrance Examination Main — Paper 1 (B.E./B.Tech.). Tests
    Class 11 + 12 Physics, Chemistry, Mathematics. MCQ + numerical-answer
    format; 90 questions total (30 per subject), 300 marks. Used as the
    qualifier for JEE Advanced and as a direct entry exam for ~30 NITs,
    IIITs, and CFTIs.

    All three subjects are now real. Mathematics was promoted out of
    `stub_concepts:` in v4.85.0 (23 concepts); Physics (24) and Chemistry
    (22) followed, and `stub_concepts:` is empty for the first time. 69
    concepts across 15 syllabus sections.

    FIVE of those 46 are NOT former stubs — `properties-of-matter`,
    `kinetic-theory`, `thermodynamics-physics`, `electromagnetic-waves`
    and `organic-basic-principles` are named units of the published JEE
    Main syllabus that the original stub list simply omitted. Promoting
    only the stubs would have left a pack claiming to cover Physics with
    no thermodynamics and Chemistry with no IUPAC nomenclature.

    TWO ids are kept but flagged: `solid-state` and `polymers` are widely
    reported as dropped in NTA's 2023/2025 syllabus rationalisation.
    jeemain.nta.nic.in is unreachable from this environment's egress
    proxy, so the primary bulletin could not settle it. They are kept
    (both are still Class 12 board content and still asked in other
    engineering entrances this platform targets) and carry
    `gate_frequency: low` rather than being deleted on secondary-source
    evidence alone — same discipline as the unsettled numerical-value
    marking rule recorded in `scoring:` below.
  scope: mcq-and-numerical
  total_marks: 300
  duration_minutes: 180
  language: en
  paper: 1

# ---------------------------------------------------------------------------
# Capability flags (eng-review D5)
# ---------------------------------------------------------------------------
# interactives_enabled is true here because Phase 1 ships the interactive
# atom kinds for the two canonical exam packs (gate-ma + jee-main). New
# operator-defined packs created via /api/admin/exam-packs default to
# false and can be flipped per-pack later.
capabilities:
  interactives_enabled: true

# ---------------------------------------------------------------------------
# Syllabus structure — three subjects, fifteen sections.
# Every concept_id below resolves to a real node in this file's own
# `concepts:` block; nothing here is a placeholder any more.
# ---------------------------------------------------------------------------
syllabus:
  # Physics and Chemistry, as NINE sections rather than two.
  #
  # Same reasoning as the Mathematics split below, applied when these two
  # subjects were promoted out of `stub_concepts:`. Sections are what the app
  # renders as TOPICS, so a single `jee-main-physics` section would have shown
  # a student one undifferentiated "Physics" bucket holding 24 concepts.
  # Section ids ARE the concept `topic` strings, and they are namespaced
  # (`jee-mechanics`, never `mechanics`) for the load-bearing reason spelled
  # out above the `concepts:` block.
  #
  # weight_pct is derived STRUCTURALLY (33.3 x n/24 for Physics, 33.3 x n/22
  # for Chemistry), not imported. NTA publishes a subject-level split only.

  - id: jee-mechanics
    title: Mechanics
    weight_pct: 11.1
    concept_ids:
      - units-and-measurements
      - kinematics-1d
      - kinematics-2d
      - newtons-laws
      - work-energy-power
      - rotational-mechanics
      - gravitation
      - properties-of-matter

  - id: jee-thermal-physics
    title: Thermal Physics
    weight_pct: 2.8
    concept_ids:
      - kinetic-theory
      - thermodynamics-physics

  - id: jee-oscillations-waves
    title: Oscillations and Waves
    weight_pct: 2.8
    concept_ids:
      - oscillations-shm
      - waves-mechanical

  - id: jee-electromagnetism
    title: Electromagnetism
    weight_pct: 9.7
    concept_ids:
      - electrostatics-coulomb
      - capacitance
      - current-electricity
      - magnetic-effects
      - electromagnetic-induction
      - alternating-current
      - electromagnetic-waves

  - id: jee-optics
    title: Optics
    weight_pct: 2.8
    concept_ids:
      - ray-optics
      - wave-optics

  - id: jee-modern-physics
    title: Modern Physics
    weight_pct: 4.1
    concept_ids:
      - dual-nature-matter
      - atoms-and-nuclei
      - semiconductor-electronics

  - id: jee-physical-chemistry
    title: Physical Chemistry
    weight_pct: 15.1
    concept_ids:
      - mole-concept
      - atomic-structure
      - chemical-bonding
      - thermodynamics-chemistry
      - equilibrium-chemical
      - equilibrium-ionic
      - redox-and-electrochemistry
      - chemical-kinetics
      - solutions-and-colligative
      - solid-state

  - id: jee-organic-chemistry
    title: Organic Chemistry
    weight_pct: 12.1
    concept_ids:
      - organic-basic-principles
      - hydrocarbons
      - haloalkanes-haloarenes
      - alcohols-phenols-ethers
      - aldehydes-ketones-acids
      - amines-and-diazonium
      - biomolecules
      - polymers

  - id: jee-inorganic-chemistry
    title: Inorganic Chemistry
    weight_pct: 6.1
    concept_ids:
      - periodic-table-trends
      - p-block-elements
      - d-and-f-block
      - coordination-compounds

  # Mathematics, as SIX sections rather than one (v4.86.0).
  #
  # This was a single `jee-main-mathematics` section holding all 23 concepts.
  # Sections are what the app renders as TOPICS (src/curriculum/topic-adapter.ts
  # maps section id + title straight onto the topic list), so one section meant
  # a student switching to JEE saw a single undifferentiated "Mathematics"
  # bucket where GATE gets eight named, separately-iconed subjects. The
  # concepts were already grouped this way in comments here; this promotes
  # those comments into the structure the UI actually reads.
  #
  # Section ids ARE the concept `topic` strings on purpose — the same
  # convention gate-ma.yml follows (its `linear-algebra` section id is its
  # `linear-algebra` topic) — so topic pages, the topic-string selectors and
  # this list cannot disagree about what a topic is called.
  #
  # weight_pct is derived STRUCTURALLY from concept counts (33.3 x n/23), not
  # imported from any published per-subtopic breakdown. NTA publishes a
  # subject-level split, not a subtopic one, and inventing precise-looking
  # subtopic weights would be exactly the fabrication this pack's `scoring:`
  # block already refuses for the numerical-value marking rule.

  - id: jee-algebra
    title: Algebra
    weight_pct: 10.1
    concept_ids:
      - sets-relations-functions
      - complex-numbers-algebra
      - quadratic-equations
      - permutations-combinations
      - binomial-theorem
      - sequences-series
      - matrices-and-determinants

  - id: jee-calculus
    title: Calculus
    weight_pct: 8.7
    concept_ids:
      - limits-jee
      - continuity-differentiability-jee
      - applications-of-derivatives
      - indefinite-integration
      - definite-integration
      - differential-equations-jee

  - id: jee-coordinate-geometry
    title: Coordinate Geometry
    weight_pct: 4.3
    concept_ids:
      - straight-lines
      - circles-coordinate
      - parabola-ellipse-hyperbola

  - id: jee-trigonometry
    title: Trigonometry
    weight_pct: 4.3
    concept_ids:
      - trigonometric-functions
      - inverse-trigonometric
      - heights-distances

  - id: jee-vectors-3d
    title: Vectors and 3D Geometry
    weight_pct: 2.9
    concept_ids:
      - vectors-jee
      - three-d-geometry

  - id: jee-probability-statistics
    title: Probability and Statistics
    weight_pct: 2.9
    concept_ids:
      - probability-jee
      - statistics-jee


# ---------------------------------------------------------------------------
# Concepts — JEE Main Mathematics (Paper 1)
#
# All 69 ids referenced by `syllabus:` above, as real concept-graph nodes:
# 23 Mathematics (v4.85.0), then 24 Physics and 22 Chemistry. The pack was
# filled subject by subject and `getSyllabus()` reported the unresolved ids
# honestly at each step rather than calling a partly migrated pack done;
# there is nothing left for it to report.
#
# TOPIC STRINGS ARE NAMESPACED (`jee-algebra`, not `algebra`) AND THAT IS
# LOAD-BEARING, not cosmetic. Concept IDS are global and uniqueness is
# enforced at boot; `topic` had no such protection, and roughly twenty call
# sites select concepts BY TOPIC STRING off the merged universe with no exam
# filter (study-plan scope, topic mastery averaging, lesson interleaving,
# the GATE marks-weight table). GATE-MA already owns `calculus`,
# `linear-algebra`, `probability-statistics`, `differential-equations`,
# `complex-variables` and `vector-calculus`. An un-namespaced JEE `calculus`
# would silently merge two exams into one study plan and one mastery average,
# with no id collision anywhere to reveal it. `npm run ci:topic-namespace`
# now refuses a topic string claimed by two packs — see
# src/curriculum/topic-namespace.ts for the full rationale.
#
# PREREQUISITES POINT ONLY AT OTHER JEE CONCEPTS. Cross-pack prerequisites
# are supported by design (concept-graph.ts's header), but JEE's calculus
# genuinely builds on JEE's own algebra, not on GATE's postgraduate-level
# treatment of the same words. Keeping the DAG self-contained also keeps
# prerequisite repair, FIRe propagation and the frontier spine inside one
# exam for a student registered for one exam.
#
# `gate_frequency` is the ConceptNode field name (kept rather than renamed
# across ~40 call sites); it means "how often this exam's papers ask it".
# Values here are structural judgements — a named JEE Main syllabus unit with
# several named subtopics that appears in every session is `high` — NOT
# imported percentages. Per-topic JEE weightage numbers circulate widely on
# SEO aggregator sites with no NTA basis (one widely-repeated claim of a 2026
# "Mathematics = 35% weightage" change contradicts the corroborated
# 100/100/100-mark, 75-question structure), so none are encoded here.
# ---------------------------------------------------------------------------
concepts:
  # ---- Algebra -----------------------------------------------------------
  - id: sets-relations-functions
    topic: jee-algebra
    label: Sets, Relations and Functions
    description: Set operations, types of relations, domain and range, composition and inverse of functions
    difficulty_base: 0.25
    gate_frequency: medium
    prerequisites: []

  - id: quadratic-equations
    topic: jee-algebra
    label: Quadratic Equations
    description: Nature of roots, relation between roots and coefficients, common roots, quadratic inequalities, location of roots in an interval
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - sets-relations-functions

  - id: complex-numbers-algebra
    topic: jee-algebra
    label: Complex Numbers
    description: Argand plane, modulus and argument, polar form, cube roots of unity, De Moivre's theorem
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - quadratic-equations

  - id: permutations-combinations
    topic: jee-algebra
    label: Permutations and Combinations
    description: Fundamental counting principle, arrangements with repetition and restriction, selections, grouping and distribution
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - sets-relations-functions

  - id: binomial-theorem
    topic: jee-algebra
    label: Binomial Theorem
    description: General and middle terms, greatest coefficient, binomial coefficient identities, applications to divisibility
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - permutations-combinations

  - id: sequences-series
    topic: jee-algebra
    label: Sequences and Series
    description: Arithmetic, geometric and harmonic progressions, means and their inequalities, sum of special series, telescoping
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - sets-relations-functions

  - id: matrices-and-determinants
    topic: jee-algebra
    label: Matrices and Determinants
    description: Determinant properties, adjoint and inverse, solving linear systems, consistency conditions, elementary row operations
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - sets-relations-functions

  # ---- Trigonometry ------------------------------------------------------
  - id: trigonometric-functions
    topic: jee-trigonometry
    label: Trigonometric Functions and Equations
    description: Identities, transformations, general solution of trigonometric equations, properties of triangles
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - sets-relations-functions

  - id: inverse-trigonometric
    topic: jee-trigonometry
    label: Inverse Trigonometric Functions
    description: Principal value branches, domain and range, identities and the sum and difference formulae with their validity conditions
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - trigonometric-functions

  - id: heights-distances
    topic: jee-trigonometry
    label: Heights and Distances
    description: Angle of elevation and depression, problems in one and two vertical planes
    difficulty_base: 0.3
    gate_frequency: low
    prerequisites:
      - trigonometric-functions

  # ---- Calculus ----------------------------------------------------------
  - id: limits-jee
    topic: jee-calculus
    label: Limits
    description: Standard limits, indeterminate forms, L'Hopital's rule, limits involving trigonometric, exponential and logarithmic functions
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - sets-relations-functions
      - sequences-series

  - id: continuity-differentiability-jee
    topic: jee-calculus
    label: Continuity and Differentiability
    description: Continuity at a point and on an interval, differentiability, chain rule, implicit and parametric differentiation, differentiation of inverse functions
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - limits-jee

  - id: applications-of-derivatives
    topic: jee-calculus
    label: Applications of Derivatives
    description: Rate of change, tangents and normals, monotonicity, maxima and minima, Rolle's and Lagrange's mean value theorems
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - continuity-differentiability-jee

  - id: indefinite-integration
    topic: jee-calculus
    label: Indefinite Integration
    description: Standard integrals, substitution, integration by parts, partial fractions, integrals of rational and irrational forms
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - continuity-differentiability-jee
      - trigonometric-functions

  - id: definite-integration
    topic: jee-calculus
    label: Definite Integration and Area
    description: Fundamental theorem, properties of definite integrals, limit of a sum, area bounded by curves
    difficulty_base: 0.55
    gate_frequency: high
    prerequisites:
      - indefinite-integration

  - id: differential-equations-jee
    topic: jee-calculus
    label: Differential Equations
    description: Order and degree, variable separable, homogeneous and linear first-order equations, formation of a differential equation
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - indefinite-integration

  # ---- Coordinate Geometry ----------------------------------------------
  - id: straight-lines
    topic: jee-coordinate-geometry
    label: Straight Lines
    description: Forms of the equation of a line, angle between two lines, family of lines, angle bisectors, pair of straight lines
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - sets-relations-functions

  - id: circles-coordinate
    topic: jee-coordinate-geometry
    label: Circles
    description: General equation, tangent and normal, chord of contact, radical axis, family of circles, orthogonal intersection
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - straight-lines

  - id: parabola-ellipse-hyperbola
    topic: jee-coordinate-geometry
    label: Conic Sections
    description: Standard equations and parametric forms, tangent and normal, chord of contact, pole and polar, director and auxiliary circles
    difficulty_base: 0.65
    gate_frequency: high
    prerequisites:
      - circles-coordinate

  # ---- Vectors and 3D ----------------------------------------------------
  - id: vectors-jee
    topic: jee-vectors-3d
    label: Vector Algebra
    description: Dot and cross product, scalar and vector triple products, geometric applications and vector proofs
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - trigonometric-functions

  - id: three-d-geometry
    topic: jee-vectors-3d
    label: Three Dimensional Geometry
    description: Direction cosines and ratios, line and plane in vector and Cartesian form, skew lines and shortest distance, angle between planes, distance of a point from a plane
    difficulty_base: 0.6
    gate_frequency: high
    prerequisites:
      - vectors-jee
      - straight-lines

  # ---- Probability and Statistics ----------------------------------------
  - id: probability-jee
    topic: jee-probability-statistics
    label: Probability
    description: Conditional probability, independence, total probability and Bayes' theorem, binomial distribution
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - permutations-combinations

  - id: statistics-jee
    topic: jee-probability-statistics
    label: Statistics
    description: Mean, median and mode for grouped and ungrouped data, mean deviation, variance, standard deviation, coefficient of variation
    difficulty_base: 0.35
    gate_frequency: medium
    prerequisites:
      - sequences-series


  # =====================  PHYSICS  =====================

  # ---- jee-mechanics -----------------------------------------------
  - id: units-and-measurements
    topic: jee-mechanics
    label: Units, Dimensions and Measurement
    description: SI units, dimensional analysis and dimensional formulae, significant figures, errors in measurement and their combination
    difficulty_base: 0.2
    gate_frequency: medium
    prerequisites: []

  - id: kinematics-1d
    topic: jee-mechanics
    label: Motion in a Straight Line
    description: Displacement velocity and acceleration, uniformly accelerated motion, graphical analysis of motion, relative velocity in one dimension
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - units-and-measurements

  - id: kinematics-2d
    topic: jee-mechanics
    label: Motion in a Plane
    description: Vector addition and resolution, projectile motion, uniform circular motion, relative velocity in two dimensions
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - kinematics-1d

  - id: newtons-laws
    topic: jee-mechanics
    label: Laws of Motion
    description: Newton's three laws, free-body diagrams, friction, connected bodies and pulleys, dynamics of circular motion
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - kinematics-2d

  - id: work-energy-power
    topic: jee-mechanics
    label: Work, Energy and Power
    description: Work by constant and variable forces, kinetic and potential energy, work-energy theorem, conservation of mechanical energy, elastic and inelastic collisions
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - newtons-laws

  - id: rotational-mechanics
    topic: jee-mechanics
    label: Rotational Motion
    description: Centre of mass, torque and angular momentum, moment of inertia and its theorems, rolling motion, conservation of angular momentum
    difficulty_base: 0.55
    gate_frequency: high
    prerequisites:
      - work-energy-power

  - id: gravitation
    topic: jee-mechanics
    label: Gravitation
    description: Universal law of gravitation, gravitational field and potential, escape and orbital velocity, satellite motion, Kepler's laws
    difficulty_base: 0.45
    gate_frequency: medium
    prerequisites:
      - newtons-laws

  - id: properties-of-matter
    topic: jee-mechanics
    label: Properties of Solids and Liquids
    description: Elasticity and moduli, pressure and Pascal's law, buoyancy, Bernoulli's principle, viscosity and Stokes' law, surface tension and capillarity, heat transfer
    difficulty_base: 0.4
    gate_frequency: medium
    prerequisites:
      - newtons-laws

  # ---- jee-thermal-physics -----------------------------------------
  - id: kinetic-theory
    topic: jee-thermal-physics
    label: Kinetic Theory of Gases
    description: Ideal gas equation from molecular assumptions, pressure and kinetic energy, degrees of freedom and equipartition, mean free path, rms and average speeds
    difficulty_base: 0.4
    gate_frequency: medium
    prerequisites:
      - units-and-measurements

  - id: thermodynamics-physics
    topic: jee-thermal-physics
    label: Thermodynamics
    description: Zeroth and first law, work done in thermodynamic processes, isothermal and adiabatic changes, second law, heat engines and refrigerators, Carnot cycle
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - kinetic-theory

  # ---- jee-oscillations-waves --------------------------------------
  - id: oscillations-shm
    topic: jee-oscillations-waves
    label: Oscillations
    description: Simple harmonic motion and its differential equation, energy in SHM, simple and spring pendulums, damped and forced oscillations, resonance
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - newtons-laws

  - id: waves-mechanical
    topic: jee-oscillations-waves
    label: Waves
    description: Travelling and standing waves, superposition, speed of a wave on a string and in a gas, beats, organ pipes, Doppler effect in sound
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - oscillations-shm

  # ---- jee-electromagnetism ----------------------------------------
  - id: electrostatics-coulomb
    topic: jee-electromagnetism
    label: Electrostatics
    description: Coulomb's law, electric field and dipoles, Gauss's law and its applications, electric potential and potential energy, conductors in a field
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - newtons-laws

  - id: capacitance
    topic: jee-electromagnetism
    label: Capacitance
    description: Parallel-plate and spherical capacitors, series and parallel combinations, dielectrics, energy stored in a capacitor, charge redistribution
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - electrostatics-coulomb

  - id: current-electricity
    topic: jee-electromagnetism
    label: Current Electricity
    description: Ohm's law and resistivity, series and parallel networks, Kirchhoff's rules, Wheatstone bridge, potentiometer, cells and internal resistance
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - electrostatics-coulomb

  - id: magnetic-effects
    topic: jee-electromagnetism
    label: Magnetic Effects of Current and Magnetism
    description: Biot-Savart and Ampere's circuital law, force on a moving charge and a current-carrying wire, torque on a loop, moving-coil galvanometer, magnetic materials
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - current-electricity

  - id: electromagnetic-induction
    topic: jee-electromagnetism
    label: Electromagnetic Induction
    description: Faraday's law and Lenz's law, motional emf, self and mutual inductance, energy stored in an inductor, eddy currents
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - magnetic-effects

  - id: alternating-current
    topic: jee-electromagnetism
    label: Alternating Current
    description: Peak and rms values, phasors, reactance and impedance, LCR series circuits, resonance and quality factor, power factor, transformers
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - electromagnetic-induction
      - oscillations-shm

  - id: electromagnetic-waves
    topic: jee-electromagnetism
    label: Electromagnetic Waves
    description: Displacement current, transverse nature of electromagnetic waves, energy and momentum transported, the electromagnetic spectrum and its uses
    difficulty_base: 0.3
    gate_frequency: medium
    prerequisites:
      - alternating-current

  # ---- jee-optics --------------------------------------------------
  - id: ray-optics
    topic: jee-optics
    label: Ray Optics and Optical Instruments
    description: Reflection at plane and spherical surfaces, refraction and total internal reflection, lens and mirror formulae, prisms and dispersion, microscopes and telescopes
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - units-and-measurements

  - id: wave-optics
    topic: jee-optics
    label: Wave Optics
    description: Huygens' principle, Young's double-slit interference, thin-film interference, single-slit diffraction, resolving power, polarisation and Brewster's law
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - waves-mechanical
      - ray-optics

  # ---- jee-modern-physics ------------------------------------------
  - id: dual-nature-matter
    topic: jee-modern-physics
    label: Dual Nature of Matter and Radiation
    description: Photoelectric effect and Einstein's equation, stopping potential, work function, photon momentum, de Broglie wavelength of matter waves
    difficulty_base: 0.35
    gate_frequency: high
    prerequisites:
      - wave-optics

  - id: atoms-and-nuclei
    topic: jee-modern-physics
    label: Atoms and Nuclei
    description: Rutherford scattering and Bohr's model, hydrogen spectral series, nuclear size and binding energy, radioactive decay laws, fission and fusion
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - dual-nature-matter

  - id: semiconductor-electronics
    topic: jee-modern-physics
    label: Semiconductor Electronics
    description: Energy bands, intrinsic and extrinsic semiconductors, p-n junction and diode characteristics, rectifiers, Zener diodes, logic gates
    difficulty_base: 0.35
    gate_frequency: high
    prerequisites:
      - atoms-and-nuclei


  # =====================  CHEMISTRY  =====================

  # ---- jee-physical-chemistry --------------------------------------
  - id: mole-concept
    topic: jee-physical-chemistry
    label: Some Basic Concepts of Chemistry
    description: Mole and Avogadro's number, empirical and molecular formulae, stoichiometry and limiting reagent, concentration terms, percentage yield
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites: []

  - id: atomic-structure
    topic: jee-physical-chemistry
    label: Atomic Structure
    description: Bohr model and hydrogen spectrum, de Broglie and Heisenberg relations, quantum numbers, shapes of orbitals, Aufbau, Pauli and Hund rules
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - mole-concept

  - id: chemical-bonding
    topic: jee-physical-chemistry
    label: Chemical Bonding and Molecular Structure
    description: Ionic and covalent bonding, Lewis structures and formal charge, VSEPR shapes, hybridisation, molecular orbital theory, bond parameters, hydrogen bonding
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - atomic-structure

  - id: thermodynamics-chemistry
    topic: jee-physical-chemistry
    label: Chemical Thermodynamics
    description: System and surroundings, internal energy and enthalpy, Hess's law, bond and formation enthalpies, entropy, Gibbs free energy and spontaneity
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - mole-concept

  - id: equilibrium-chemical
    topic: jee-physical-chemistry
    label: Chemical Equilibrium
    description: Reversible reactions and dynamic equilibrium, Kc and Kp, reaction quotient, Le Chatelier's principle, relation of K to Gibbs free energy
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - thermodynamics-chemistry

  - id: equilibrium-ionic
    topic: jee-physical-chemistry
    label: Ionic Equilibrium
    description: Acid-base theories, Ka Kb and pH, common-ion effect, buffers and the Henderson equation, salt hydrolysis, solubility product
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - equilibrium-chemical

  - id: redox-and-electrochemistry
    topic: jee-physical-chemistry
    label: Redox Reactions and Electrochemistry
    description: Oxidation numbers and balancing redox equations, electrochemical cells, standard electrode potentials, Nernst equation, conductance, Faraday's laws of electrolysis
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - equilibrium-ionic

  - id: chemical-kinetics
    topic: jee-physical-chemistry
    label: Chemical Kinetics
    description: Rate of reaction and rate law, order and molecularity, integrated rate equations for zero and first order, half-life, Arrhenius equation and activation energy
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - equilibrium-chemical

  - id: solutions-and-colligative
    topic: jee-physical-chemistry
    label: Solutions
    description: Concentration units, Raoult's law and ideal solutions, relative lowering of vapour pressure, boiling-point elevation and freezing-point depression, osmotic pressure, van't Hoff factor
    difficulty_base: 0.4
    gate_frequency: medium
    prerequisites:
      - mole-concept

  - id: solid-state
    topic: jee-physical-chemistry
    label: Solid State
    description: Crystal lattices and unit cells, packing efficiency, density of a unit cell, voids, point defects, electrical and magnetic properties of solids
    difficulty_base: 0.35
    gate_frequency: low
    prerequisites:
      - chemical-bonding

  # ---- jee-organic-chemistry ---------------------------------------
  - id: organic-basic-principles
    topic: jee-organic-chemistry
    label: Basic Principles of Organic Chemistry
    description: IUPAC nomenclature, structural and stereo isomerism, inductive resonance and hyperconjugation effects, reaction intermediates, types of organic reactions, purification methods
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - chemical-bonding

  - id: hydrocarbons
    topic: jee-organic-chemistry
    label: Hydrocarbons
    description: Alkanes alkenes and alkynes, conformations, Markovnikov and anti-Markovnikov addition, ozonolysis, aromaticity and Huckel's rule, electrophilic aromatic substitution
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - organic-basic-principles

  - id: haloalkanes-haloarenes
    topic: jee-organic-chemistry
    label: Haloalkanes and Haloarenes
    description: Preparation and physical properties, SN1 and SN2 mechanisms and their stereochemistry, elimination versus substitution, reactivity of aryl halides, Grignard reagents
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - hydrocarbons

  - id: alcohols-phenols-ethers
    topic: jee-organic-chemistry
    label: Alcohols, Phenols and Ethers
    description: Preparation and reactions of alcohols, acidity of phenols and substituent effects, Reimer-Tiemann and Kolbe reactions, Williamson ether synthesis, ether cleavage
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - haloalkanes-haloarenes

  - id: aldehydes-ketones-acids
    topic: jee-organic-chemistry
    label: Aldehydes, Ketones and Carboxylic Acids
    description: Nucleophilic addition to the carbonyl group, aldol and Cannizzaro reactions, oxidation and reduction, distinguishing tests, acidity of carboxylic acids and their derivatives
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - alcohols-phenols-ethers

  - id: amines-and-diazonium
    topic: jee-organic-chemistry
    label: Amines and Diazonium Salts
    description: Preparation and basicity of amines, Hofmann and Gabriel syntheses, carbylamine and Hinsberg tests, diazotisation and coupling, Sandmeyer reactions
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - aldehydes-ketones-acids

  - id: biomolecules
    topic: jee-organic-chemistry
    label: Biomolecules
    description: Classification of carbohydrates and their glycosidic linkages, amino acids and the peptide bond, protein structure, enzymes, vitamins, nucleic acids
    difficulty_base: 0.3
    gate_frequency: medium
    prerequisites:
      - alcohols-phenols-ethers

  - id: polymers
    topic: jee-organic-chemistry
    label: Polymers
    description: Addition and condensation polymerisation, copolymers, natural and synthetic rubber, commercially important polymers and their monomers, biodegradable polymers
    difficulty_base: 0.25
    gate_frequency: low
    prerequisites:
      - hydrocarbons

  # ---- jee-inorganic-chemistry -------------------------------------
  - id: periodic-table-trends
    topic: jee-inorganic-chemistry
    label: Classification of Elements and Periodicity
    description: Modern periodic law and blocks, atomic and ionic radii, ionisation enthalpy, electron gain enthalpy, electronegativity, diagonal relationship and anomalous behaviour
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - atomic-structure

  - id: p-block-elements
    topic: jee-inorganic-chemistry
    label: p-Block Elements
    description: Group trends across groups 13 to 18, oxides oxyacids and halides, allotropy, interhalogens, noble-gas compounds, named preparations and structures
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - periodic-table-trends

  - id: d-and-f-block
    topic: jee-inorganic-chemistry
    label: d- and f-Block Elements
    description: Variable oxidation states, colour magnetic moment and catalytic behaviour, potassium dichromate and permanganate, lanthanoid contraction, actinoids
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - periodic-table-trends

  - id: coordination-compounds
    topic: jee-inorganic-chemistry
    label: Coordination Compounds
    description: Werner's theory and nomenclature, isomerism in complexes, valence bond and crystal field theories, colour and magnetic properties, stability and applications
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - d-and-f-block

