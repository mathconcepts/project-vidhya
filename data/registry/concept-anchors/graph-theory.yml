version: 1
topic: graph-theory
concepts:
  euler-hamilton:
    anchor: "A delivery firm checks a no-repeat route instantly; touching every address has no known shortcut."
  graph-basics:
    anchor: "A social network can sanity-check its data: everyone's friend-counts must sum to an even number."
  graph-coloring:
    anchor: "A compiler colors a conflict graph to assign CPU registers; exact optimal coloring is NP-hard."
  graph-connectivity:
    anchor: "A telecom engineer finds which single cable, if cut, would split the city's fibre network in two."
  planar-graphs:
    anchor: "A circuit-board designer checks if every trace fits on one copper layer without crossing another."
  shortest-paths:
    anchor: "A maps app settles the nearest city first to find cheapest routes; it fails if costs go negative."
  trees:
    anchor: "A power company wires new substations with exactly enough cable to reach each one and no more."
