<!-- @dsCard group="Colors" viewport="700x180" subtitle="Red and orange are system states, never decoration" name="System states" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>System states</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

</style></head><body>
<div class="row">
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#ff3b30;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Red</div><div class="mono">--red</div><div class="mono">#ff3b30</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#d70015;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Red ink</div><div class="mono">--red-ink</div><div class="mono">#d70015</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#ff9f0a;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Orange</div><div class="mono">--orange</div><div class="mono">#ff9f0a</div></div>
</div>
<div class="col" style="gap:6px">
  <div style="width:96px;height:56px;border-radius:var(--radius-sm);background:#b25000;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.08)"></div>
  <div><div style="font-size:var(--text-footnote);font-weight:600">Orange ink</div><div class="mono">--orange-ink</div><div class="mono">#b25000</div></div>
</div>
</div>
<p class="lbl" style="margin-top:14px">Orange = timer running low or partial mastery. Red = error or a wrong answer. Neither is a brand colour.</p>
</body></html>
