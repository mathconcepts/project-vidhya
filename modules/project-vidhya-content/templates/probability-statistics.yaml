topic_family: probability-statistics

intuition:
  scaffold: counting-or-sample-space
  guidance: |
    Either count favorable / total outcomes, or describe the sample space
    explicitly. Avoid Bayes-flavored language until formal_definition.
  bloom_floor: 2

  stances:
    shaken: |
      Count one small, literal sample space by hand — list the outcomes,
      count the favourable ones — before naming any formula. Let the
      fraction appear as a count, not as a rule stated in the abstract.
    assured: |
      Skip the counting and go straight to which conditional is being
      asked for — P(A|B) is not P(B|A), and that reversal is the single
      most common way marks are lost here, not the arithmetic.

formal_definition:
  scaffold: axiom-or-distribution
  guidance: |
    State distribution PMF/PDF or the rule (Bayes, total probability,
    expectation linearity). Display math.
  bloom_floor: 3

worked_example:
  scaffold: step-unfold
  guidance: |
    Identify event → set up sample space or distribution → compute → answer.
    Include unit check (probability ∈ [0,1]).
  bloom_floor: 3

  stances:
    shaken: |
      Identify the event and set up the sample space as one separate,
      visible step before any computation — do not fold identification and
      computation into the same line. End with the probability-in-[0,1]
      check shown explicitly, not just claimed.
    assured: |
      Name which conditional or which independence assumption the problem
      actually rests on before computing — skip re-deriving a sample space a
      confident reader can set up mentally. Flag the direction of the
      conditional explicitly.

common_traps:
  scaffold: wrong-then-right
  guidance: |
    Common: confusing P(A|B) vs P(B|A) (the prosecutor's fallacy),
    forgetting independence, double-counting in sample space.
  bloom_floor: 4

micro_exercise:
  scaffold: one-shot-check
  bloom_floor: 3

retrieval_prompt:
  scaffold: flashcard
  bloom_floor: 2

visual_analogy:
  scaffold: tree-or-grid
  guidance: |
    Decision tree, Venn diagram, or 2x2 grid for joint distributions.
  bloom_floor: 2

exam_pattern:
  scaffold: gate-style-stem
  exam_pattern_required: true
  bloom_floor: 3

mnemonic:
  scaffold: short-rhyme
  bloom_floor: 2

interleaved_drill:
  scaffold: mixed-rule-set
  bloom_floor: 4

hook:
  scaffold: surprise-result
  bloom_floor: 1
  stances:
    shaken: |
      One small, countable scenario with a single surprising-but-checkable
      number — no framing about probability in general.
    assured: |
      State the result that looks wrong until the conditioning is made
      explicit — that reversal is the exam's favourite trap in this topic.
