<!-- @dsCard group="Brand" viewport="700x220" subtitle="The one signature treatment: verified content only" name="Receipt marker" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Receipt marker</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--surface-canvas)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:var(--text-caption);color:var(--text-secondary);letter-spacing:var(--tracking-body)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

</style></head><body>
<div style="border-radius:var(--radius-sm);padding:14px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--receipt-line);max-width:420px">
  <div style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--green-ink);margin-bottom:8px">
    <span style="width:15px;height:15px;border-radius:999px;background:var(--green);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center">✓</span> Verified · Wolfram
  </div>
  <div style="font-size:16px">The series converges for |x| &lt; 1.</div>
</div>
<div style="margin-top:12px;border-radius:var(--radius-sm);padding:14px;background:var(--surface-card);box-shadow:var(--shadow-raise);max-width:420px;font-size:16px;color:var(--text-secondary)">An estimate. No receipt, no border.</div>
</body></html>
