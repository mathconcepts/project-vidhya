metadata:
  id: gate-ma
  name: GATE Engineering Mathematics
  conducting_body: IIT (host rotates)
  year_effective_from: 2024
  syllabus_source_url: https://gate.iitk.ac.in/syllabi/MA.pdf
  description: >
    GATE Engineering Mathematics (MA) section. Tests undergraduate-level
    engineering mathematics covering linear algebra, calculus, differential
    equations, probability, numerical methods, complex variables, and
    transform theory. MCQ and MSQ format; no subjective questions.
  scope: mcq-rigorous
  total_marks: 100
  duration_minutes: 180
  language: en

# ---------------------------------------------------------------------------
# Canonical concept universe (CEO plan §6 baseline / Phase 0 registry
# unification) — the single source of truth for GATE-MA's concept graph.
# src/constants/concept-graph.ts loads this section at module-init and
# reconstructs its exported ALL_CONCEPTS/CONCEPT_MAP from it; it no longer
# hardcodes concept data. Edit concepts here, not in the .ts file.
#
# This is deliberately separate from `syllabus:` below (which curates a
# partial, in-progress subset for weight/depth/emphasis metadata) and from
# `concept_links:` (per-exam depth/weight/emphasis). All three sections can
# reference disjoint or overlapping concept_id sets — `concepts:` is just
# "what nodes exist", the others are "how this exam treats them".
# ---------------------------------------------------------------------------
concepts:
  - id: sequences
    topic: calculus
    label: Sequences
    description: Convergence, divergence, bounded sequences
    difficulty_base: 0.3
    gate_frequency: medium
    prerequisites: []
  - id: series
    topic: calculus
    label: Infinite Series
    description: Convergence tests, power series, Taylor/Maclaurin
    difficulty_base: 0.4
    gate_frequency: medium
    prerequisites:
      - sequences
  - id: limits
    topic: calculus
    label: Limits
    description: Limit evaluation, L'Hôpital's rule, indeterminate forms
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - sequences
  - id: continuity
    topic: calculus
    label: Continuity
    description: Types of discontinuity, intermediate value theorem
    difficulty_base: 0.3
    gate_frequency: medium
    prerequisites:
      - limits
  - id: differentiability
    topic: calculus
    label: Differentiability
    description: Differentiability vs continuity, piecewise functions
    difficulty_base: 0.4
    gate_frequency: medium
    prerequisites:
      - continuity
  - id: derivatives-basic
    topic: calculus
    label: Basic Derivatives
    description: Power rule, sum/difference, basic functions
    difficulty_base: 0.2
    gate_frequency: high
    prerequisites:
      - differentiability
  - id: chain-rule
    topic: calculus
    label: Chain Rule
    description: Composite function differentiation
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - derivatives-basic
  - id: product-quotient-rule
    topic: calculus
    label: Product & Quotient Rule
    description: Product rule, quotient rule, combined applications
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - derivatives-basic
  - id: implicit-differentiation
    topic: calculus
    label: Implicit Differentiation
    description: Implicit functions, related rates
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - chain-rule
  - id: maxima-minima
    topic: calculus
    label: Maxima & Minima
    description: Critical points, second derivative test, optimization
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - chain-rule
      - product-quotient-rule
  - id: mean-value-theorems
    topic: calculus
    label: Mean Value Theorems
    description: Rolle's theorem, Lagrange MVT, Cauchy MVT
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - differentiability
      - continuity
  - id: integration-basics
    topic: calculus
    label: Integration Basics
    description: Antiderivatives, basic integration formulas
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - derivatives-basic
  - id: integration-substitution
    topic: calculus
    label: Integration by Substitution
    description: u-substitution, trigonometric substitution
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - integration-basics
      - chain-rule
  - id: integration-by-parts
    topic: calculus
    label: Integration by Parts
    description: LIATE rule, repeated integration by parts
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - integration-basics
      - product-quotient-rule
  - id: partial-fractions
    topic: calculus
    label: Partial Fractions
    description: Decomposition for rational functions
    difficulty_base: 0.4
    gate_frequency: medium
    prerequisites:
      - integration-basics
  - id: definite-integrals
    topic: calculus
    label: Definite Integrals
    description: FTC, properties, area computation
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - integration-substitution
      - integration-by-parts
      - partial-fractions
  - id: improper-integrals
    topic: calculus
    label: Improper Integrals
    description: Infinite limits, convergence of integrals
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - definite-integrals
      - limits
  - id: multivariable-calculus
    topic: calculus
    label: Multivariable Calculus
    description: Partial derivatives, total derivative, Jacobian
    difficulty_base: 0.6
    gate_frequency: high
    prerequisites:
      - chain-rule
      - definite-integrals
  - id: multiple-integrals
    topic: calculus
    label: Multiple Integrals
    description: Double/triple integrals, change of variables
    difficulty_base: 0.7
    gate_frequency: high
    prerequisites:
      - multivariable-calculus
      - definite-integrals
  - id: matrix-operations
    topic: linear-algebra
    label: Matrix Operations
    description: Addition, multiplication, transpose, properties
    difficulty_base: 0.2
    gate_frequency: high
    prerequisites: []
  - id: determinants
    topic: linear-algebra
    label: Determinants
    description: Computation, properties, cofactor expansion
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - matrix-operations
    encompasses:
      # Cofactor expansion is repeated matrix-entry arithmetic — a
      # determinant problem drills multiplication/addition heavily.
      - id: matrix-operations
        weight: 0.6
  - id: matrix-inverse
    topic: linear-algebra
    label: Matrix Inverse
    description: Inverse computation, adjugate method, properties
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - determinants
    encompasses:
      # The adjugate/cofactor inverse method IS a determinant computation.
      - id: determinants
        weight: 0.6
      # Verifying AA⁻¹ = I and computing cofactors is dense matrix arithmetic.
      - id: matrix-operations
        weight: 0.85
  - id: systems-of-equations
    topic: linear-algebra
    label: Systems of Linear Equations
    description: Gaussian elimination, consistency, solution types
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - matrix-inverse
    encompasses:
      # Row operations during elimination are elementary matrix arithmetic.
      - id: matrix-operations
        weight: 0.5
      # Solving via x = A⁻¹b is one of the standard solution techniques.
      - id: matrix-inverse
        weight: 0.35
  - id: rank-nullity
    topic: linear-algebra
    label: Rank & Nullity
    description: Row echelon, rank, nullity, rank-nullity theorem
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - systems-of-equations
    encompasses:
      # Row-reducing to echelon form to read off rank IS the Gaussian
      # elimination process from systems-of-equations.
      - id: systems-of-equations
        weight: 0.6
  - id: vector-spaces
    topic: linear-algebra
    label: Vector Spaces
    description: Subspaces, span, basis, dimension
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - rank-nullity
    encompasses:
      # Dimension/basis arguments lean directly on the rank-nullity theorem.
      - id: rank-nullity
        weight: 0.4
  - id: linear-transformations
    topic: linear-algebra
    label: Linear Transformations
    description: Kernel, image, matrix representation
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - vector-spaces
    encompasses:
      # Kernel/image arguments are subspace-membership reasoning.
      - id: vector-spaces
        weight: 0.5
      # Matrix representation of a transformation is matrix arithmetic.
      - id: matrix-operations
        weight: 0.4
  - id: eigenvalues
    topic: linear-algebra
    label: Eigenvalues & Eigenvectors
    description: Characteristic polynomial, computation, properties
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - determinants
      - systems-of-equations
    encompasses:
      # The characteristic polynomial IS det(A - λI).
      - id: determinants
        weight: 0.7
      # Finding eigenvectors means solving (A - λI)v = 0.
      - id: systems-of-equations
        weight: 0.5
  - id: diagonalization
    topic: linear-algebra
    label: Diagonalization
    description: Diagonalizability, similar matrices, powers
    difficulty_base: 0.6
    gate_frequency: high
    prerequisites:
      - eigenvalues
      - vector-spaces
    encompasses:
      # Diagonalizing requires computing eigenvalues/eigenvectors first.
      - id: eigenvalues
        weight: 0.8
      # Checking the eigenvector set spans (forms a basis) needs independence.
      - id: linear-independence
        weight: 0.4
  - id: cayley-hamilton
    topic: linear-algebra
    label: Cayley-Hamilton Theorem
    description: Statement, applications, matrix powers/inverse
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - eigenvalues
    encompasses:
      # The theorem is stated in terms of the characteristic polynomial.
      - id: eigenvalues
        weight: 0.5
      # That characteristic polynomial is itself a determinant expansion.
      - id: determinants
        weight: 0.4
  - id: orthogonality
    topic: linear-algebra
    label: Orthogonality
    description: Gram-Schmidt, orthogonal matrices, projections
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - vector-spaces
    encompasses:
      # Orthogonal complements and projections are subspace reasoning.
      - id: vector-spaces
        weight: 0.45
  - id: trace
    topic: linear-algebra
    label: Trace of a Matrix
    description: Trace definition, properties, connection to eigenvalues
    difficulty_base: 0.2
    gate_frequency: high
    prerequisites:
      - matrix-operations
      - eigenvalues
    encompasses:
      # Trace is literally a sum over diagonal entries produced by matrix ops.
      - id: matrix-operations
        weight: 0.5
      # trace(A) = Σλᵢ problems require finding the eigenvalues first.
      - id: eigenvalues
        weight: 0.4
  - id: linear-independence
    topic: linear-algebra
    label: Linear Independence
    description: Linear independence, dependence, span, basis
    difficulty_base: 0.35
    gate_frequency: high
    prerequisites:
      - vector-spaces
    encompasses:
      # Testing independence is a span/basis argument over a vector space.
      - id: vector-spaces
        weight: 0.5
  - id: null-space-column-space
    topic: linear-algebra
    label: Null Space & Column Space
    description: Null space (kernel), column space (range), row space
    difficulty_base: 0.45
    gate_frequency: high
    prerequisites:
      - rank-nullity
      - linear-independence
    encompasses:
      # dim(null space) + dim(column space) = n IS the rank-nullity theorem.
      - id: rank-nullity
        weight: 0.6
      # A column-space basis is found by keeping independent columns.
      - id: linear-independence
        weight: 0.5
      # The null space is exactly the solution set of Ax = 0.
      - id: systems-of-equations
        weight: 0.4
  - id: symmetric-matrices
    topic: linear-algebra
    label: Symmetric Matrices
    description: Real eigenvalues, orthogonal eigenvectors, spectral decomposition
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - eigenvalues
      - orthogonality
    encompasses:
      # The headline result is about a symmetric matrix's eigenvalues.
      - id: eigenvalues
        weight: 0.6
      # Its eigenvectors are shown/used to be orthogonal.
      - id: orthogonality
        weight: 0.5
  - id: inner-product-spaces
    topic: linear-algebra
    label: Inner Product Spaces
    description: Inner products, norms, Cauchy-Schwarz inequality
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - vector-spaces
    encompasses:
      # Inner products are defined and reasoned about over a vector space.
      - id: vector-spaces
        weight: 0.5
  - id: gram-schmidt
    topic: linear-algebra
    label: Gram-Schmidt Process
    description: Orthogonalization; constructing orthonormal bases from linearly independent sets
    difficulty_base: 0.55
    gate_frequency: medium
    prerequisites:
      - inner-product-spaces
      - orthogonality
    encompasses:
      # Every step is an inner-product (projection) computation.
      - id: inner-product-spaces
        weight: 0.8
      # The whole point of the algorithm is producing orthogonal vectors.
      - id: orthogonality
        weight: 0.5
      # It starts from — and implicitly re-verifies — a linearly independent set.
      - id: linear-independence
        weight: 0.4
  - id: change-of-basis
    topic: linear-algebra
    label: Change of Basis
    description: Change-of-basis matrix; representing vectors and transformations in new coordinates
    difficulty_base: 0.55
    gate_frequency: medium
    prerequisites:
      - linear-independence
      - linear-transformations
    encompasses:
      # The new coordinate vectors must themselves form an independent set.
      - id: linear-independence
        weight: 0.4
      # The change-of-basis matrix is itself a linear transformation.
      - id: linear-transformations
        weight: 0.5
  - id: lu-factorization
    topic: linear-algebra
    label: LU Factorization
    description: LU decomposition; forward and backward substitution for solving Ax=b
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - systems-of-equations
      - matrix-operations
    encompasses:
      # Forward/backward substitution solves two triangular systems.
      - id: systems-of-equations
        weight: 0.6
      # Verifying LU = A and applying the factors is matrix multiplication.
      - id: matrix-operations
        weight: 0.5
  - id: least-squares
    topic: linear-algebra
    label: Least Squares
    description: Least squares solutions to overdetermined systems; normal equations AᵀAx = Aᵀb
    difficulty_base: 0.55
    gate_frequency: medium
    prerequisites:
      - systems-of-equations
      - orthogonality
    encompasses:
      # The normal equations are themselves solved as a linear system.
      - id: systems-of-equations
        weight: 0.5
      # Least squares IS the orthogonal projection onto the column space.
      - id: orthogonality
        weight: 0.5
  - id: quadratic-forms
    topic: linear-algebra
    label: Quadratic Forms
    description: Quadratic forms xᵀAx; classification by eigenvalue signs and Sylvester criterion
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - symmetric-matrices
      - eigenvalues
    encompasses:
      # The matrix in xᵀAx is required to be symmetric.
      - id: symmetric-matrices
        weight: 0.6
      # Classification is read directly off the sign of the eigenvalues.
      - id: eigenvalues
        weight: 0.5
  - id: positive-definite-matrices
    topic: linear-algebra
    label: Positive Definite Matrices
    description: Positive definite, semidefinite, negative definite; tests and applications
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - quadratic-forms
    encompasses:
      # Definiteness IS a classification of the associated quadratic form.
      - id: quadratic-forms
        weight: 0.7
      # The eigenvalue-sign test is the most common definiteness check.
      - id: eigenvalues
        weight: 0.4
  - id: spectral-theorem
    topic: linear-algebra
    label: Spectral Theorem
    description: Spectral decomposition A = QΛQᵀ for symmetric matrices; matrix functions
    difficulty_base: 0.65
    gate_frequency: medium
    prerequisites:
      - symmetric-matrices
      - diagonalization
    encompasses:
      # The theorem is specifically about symmetric matrices.
      - id: symmetric-matrices
        weight: 0.7
      # A = QΛQᵀ is an orthogonal diagonalization.
      - id: diagonalization
        weight: 0.6
  - id: svd
    topic: linear-algebra
    label: Singular Value Decomposition
    description: SVD A = UΣVᵀ; singular values; rank; low-rank approximation
    difficulty_base: 0.7
    gate_frequency: medium
    prerequisites:
      - eigenvalues
      - symmetric-matrices
      - orthogonality
    encompasses:
      # Singular values are sqrt of the eigenvalues of AᵀA.
      - id: eigenvalues
        weight: 0.7
      # U and V are constructed to be orthogonal matrices.
      - id: orthogonality
        weight: 0.6
      # AᵀA / AAᵀ are symmetric and are the matrices actually diagonalized.
      - id: symmetric-matrices
        weight: 0.5
  - id: jordan-normal-form
    topic: linear-algebra
    label: Jordan Normal Form
    description: Jordan canonical form; Jordan blocks; minimal polynomial for defective matrices
    difficulty_base: 0.75
    gate_frequency: low
    prerequisites:
      - eigenvalues
      - diagonalization
    encompasses:
      # Generalized eigenvectors are built from ordinary eigenvalue computation.
      - id: eigenvalues
        weight: 0.6
      # Jordan form is the direct generalization when diagonalization fails.
      - id: diagonalization
        weight: 0.5
  - id: matrix-norms
    topic: linear-algebra
    label: Matrix Norms & Condition Number
    description: Matrix norms (1, 2, Frobenius, infinity); condition number κ(A); ill-conditioning
    difficulty_base: 0.6
    gate_frequency: low
    prerequisites:
      - svd
      - eigenvalues
    encompasses:
      # The 2-norm and condition number are read directly off singular values.
      - id: svd
        weight: 0.6
      # The spectral radius (dominant |eigenvalue|) bounds several norms.
      - id: eigenvalues
        weight: 0.4
  - id: ode-first-order
    topic: differential-equations
    label: First Order ODEs
    description: Separable, exact, linear first-order
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - integration-basics
      - derivatives-basic
  - id: ode-bernoulli
    topic: differential-equations
    label: Bernoulli Equations
    description: Reduction to linear via substitution
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - ode-first-order
  - id: ode-exact
    topic: differential-equations
    label: Exact Equations
    description: Exactness condition, integrating factors
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - ode-first-order
      - multivariable-calculus
  - id: ode-second-order-homo
    topic: differential-equations
    label: Second Order Homogeneous
    description: Characteristic equation, complementary solution
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - ode-first-order
      - eigenvalues
  - id: ode-second-order-nonhomo
    topic: differential-equations
    label: Second Order Non-Homogeneous
    description: Particular solution, undetermined coefficients, variation of parameters
    difficulty_base: 0.6
    gate_frequency: high
    prerequisites:
      - ode-second-order-homo
      - integration-by-parts
  - id: ode-higher-order
    topic: differential-equations
    label: Higher Order ODEs
    description: nth order linear, operator methods
    difficulty_base: 0.7
    gate_frequency: medium
    prerequisites:
      - ode-second-order-nonhomo
  - id: pde-basics
    topic: differential-equations
    label: PDE Basics
    description: Classification, separation of variables, wave/heat/Laplace
    difficulty_base: 0.7
    gate_frequency: medium
    prerequisites:
      - ode-second-order-homo
      - multivariable-calculus
  - id: counting-principles
    topic: probability-statistics
    label: Counting Principles
    description: Permutations, combinations, pigeonhole
    difficulty_base: 0.3
    gate_frequency: medium
    prerequisites: []
  - id: probability-basics
    topic: probability-statistics
    label: Probability Basics
    description: Axioms, conditional, Bayes theorem
    difficulty_base: 0.3
    gate_frequency: high
    prerequisites:
      - counting-principles
  - id: random-variables
    topic: probability-statistics
    label: Random Variables
    description: PMF, PDF, CDF, expectation, variance
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - probability-basics
      - integration-basics
  - id: discrete-distributions
    topic: probability-statistics
    label: Discrete Distributions
    description: Binomial, Poisson, geometric, hypergeometric
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - random-variables
  - id: continuous-distributions
    topic: probability-statistics
    label: Continuous Distributions
    description: Normal, exponential, uniform, gamma
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - random-variables
      - definite-integrals
  - id: joint-distributions
    topic: probability-statistics
    label: Joint Distributions
    description: Joint, marginal, conditional distributions, independence
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - continuous-distributions
      - multiple-integrals
  - id: hypothesis-testing
    topic: probability-statistics
    label: Hypothesis Testing
    description: Type I/II errors, p-values, confidence intervals
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - continuous-distributions
  - id: regression-correlation
    topic: probability-statistics
    label: Regression & Correlation
    description: Linear regression, correlation coefficient
    difficulty_base: 0.5
    gate_frequency: medium
    prerequisites:
      - random-variables
  - id: complex-numbers
    topic: complex-variables
    label: Complex Numbers
    description: Algebra, polar form, De Moivre's theorem
    difficulty_base: 0.3
    gate_frequency: medium
    prerequisites: []
  - id: analytic-functions
    topic: complex-variables
    label: Analytic Functions
    description: Cauchy-Riemann equations, harmonic functions
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - complex-numbers
      - multivariable-calculus
  - id: complex-integration
    topic: complex-variables
    label: Complex Integration
    description: Contour integrals, Cauchy integral theorem/formula
    difficulty_base: 0.6
    gate_frequency: high
    prerequisites:
      - analytic-functions
      - definite-integrals
  - id: taylor-laurent
    topic: complex-variables
    label: Taylor & Laurent Series
    description: Series expansions, singularities classification
    difficulty_base: 0.6
    gate_frequency: high
    prerequisites:
      - complex-integration
      - series
  - id: residue-calculus
    topic: complex-variables
    label: Residue Calculus
    description: Residue theorem, real integral evaluation
    difficulty_base: 0.7
    gate_frequency: high
    prerequisites:
      - taylor-laurent
  - id: conformal-mapping
    topic: complex-variables
    label: Conformal Mapping
    description: Bilinear transformations, Joukowski
    difficulty_base: 0.7
    gate_frequency: low
    prerequisites:
      - analytic-functions
  - id: root-finding
    topic: numerical-methods
    label: Root Finding
    description: Bisection, Newton-Raphson, secant, fixed-point
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - derivatives-basic
      - continuity
  - id: interpolation
    topic: numerical-methods
    label: Interpolation
    description: Lagrange, Newton divided differences, splines
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - systems-of-equations
  - id: numerical-integration
    topic: numerical-methods
    label: Numerical Integration
    description: Trapezoidal, Simpson's, Gaussian quadrature
    difficulty_base: 0.4
    gate_frequency: high
    prerequisites:
      - definite-integrals
      - interpolation
  - id: numerical-ode
    topic: numerical-methods
    label: Numerical ODE Solvers
    description: Euler, Runge-Kutta, stability analysis
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - ode-first-order
      - root-finding
  - id: numerical-linear-algebra
    topic: numerical-methods
    label: Numerical Linear Algebra
    description: LU decomposition, iterative methods, condition number
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - systems-of-equations
      - matrix-inverse
  - id: laplace-transform
    topic: transform-theory
    label: Laplace Transform
    description: Definition, properties, standard transforms
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - improper-integrals
      - ode-second-order-nonhomo
  - id: inverse-laplace
    topic: transform-theory
    label: Inverse Laplace Transform
    description: Partial fractions method, convolution
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - laplace-transform
      - partial-fractions
  - id: laplace-applications
    topic: transform-theory
    label: Laplace Applications
    description: Solving ODEs, circuit analysis, transfer functions
    difficulty_base: 0.6
    gate_frequency: high
    prerequisites:
      - inverse-laplace
  - id: fourier-series
    topic: transform-theory
    label: Fourier Series
    description: Trigonometric series, Dirichlet conditions, Parseval
    difficulty_base: 0.5
    gate_frequency: high
    prerequisites:
      - definite-integrals
      - series
  - id: fourier-transform
    topic: transform-theory
    label: Fourier Transform
    description: FT properties, convolution, applications
    difficulty_base: 0.6
    gate_frequency: medium
    prerequisites:
      - fourier-series
      - improper-integrals
  - id: z-transform
    topic: transform-theory
    label: Z-Transform
    description: Definition, properties, inverse, difference equations
