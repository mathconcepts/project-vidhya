name: CI

# Wave 7 deliverable 6 — first CI workflow for this repo (no .github/
# directory existed before). Backend: Node 20 (matches package.json
# "engines" and the production Dockerfiles), npm ci, typecheck, test
# (exact script names confirmed from package.json's "scripts" block:
# "typecheck": "tsc --noEmit", "test": "vitest run"). Frontend: npm ci +
# `npx tsc --noEmit` directly, since frontend/package.json has no
# "typecheck" script of its own, plus `npm test` (frontend/vitest.config.ts
# + @testing-library are already wired — the repo has 40+ frontend test
# files under frontend/src/**/*.test.{ts,tsx}, so there's no reason to
# skip running them in CI). Frontend lint is intentionally NOT run here:
# both package.json "lint" scripts invoke eslint, but eslint isn't listed
# in either package's devDependencies, so `npm run lint` would fail on a
# clean install — that's a separate fix (add + configure eslint) from
# aligning CI to what's already working.
#
# U1-14 added a `lint:fork-test` step between typecheck and test: fails
# the build on a NEW literal exam-name string (GATE/BITSAT/JEE/NEET/CSIR/
# UGEE or their kebab-case exam-catalog ids) inside src/core, src/gbrain,
# src/readiness, or src/scoring — the engine dirs that must stay
# exam-agnostic per the Fork Test v2 architecture law. Pre-existing
# violations are frozen in scripts/fork-test-lint-baseline.json so this
# ratchets forward without blocking on debt this change didn't introduce;
# see scripts/fork-test-lint.mjs's header for the full rationale.
#
# CEO plan Phase 0 (SOTA facelift) §5.1 added a `ci:pg-allowlist` step:
# same ratchet shape as fork-test-lint, this time over scripts/
# pg-import-allowlist.json — every file outside src/storage/ that imports
# 'pg' directly is frozen in that list; a new one appearing anywhere else
# fails CI unless added to the list explicitly in the same diff.
#
# §4 ("the law": one interface, one config source, one CI conformance
# suite) added `ci:seam-registry` — fails the build if a seam listed in
# seam-registry.json points at an interface file or conformance test path
# that no longer exists on disk.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fork-test lint (no exam-name literals in engine modules)
        run: npm run lint:fork-test

      # Content gate (realignment plan D4.2): atoms-dir/concept-id check,
      # retired-id grep, placeholder ratchet, golden-set answer keys.
      #
      # CONTENT_CI_STRICT is now 'true' — the flip the rule below always
      # called for. The 82 grandfathered placeholders are gone (all 82
      # explainers carry model: gate-em-concept-files with real bodies), so
      # the allowance had become dead slack: the gate reported
      # "0 placeholder explainers (allowed 82)" and would have waved through
      # 82 new ones in silence. Strict mode requires zero, and passes today.
      #
      # Original rule, kept because it explains the sequencing: the shipped
      # placeholders were grandfathered as the ratchet baseline, CI failed
      # only if the count INCREASED, and the flip was owed in the same commit
      # that landed the real explainers.json. The gate is never permanently
      # red and --allow-placeholder never becomes routine.
      - name: Content gate (golden set + placeholder ratchet + atoms-dir)
        env:
          CONTENT_CI_STRICT: 'true'
        run: npm run ci:content-gate

      # pg-import allowlist ratchet (CEO plan Phase 0 §5.1): fails if a file
      # outside src/storage/ starts importing 'pg' at runtime without being
      # added to scripts/pg-import-allowlist.json in the same diff. The
      # allowlist may shrink freely as files migrate onto the storage
      # boundary; growing it requires an explicit, reviewable edit.
      - name: pg-import allowlist ratchet
        run: npm run ci:pg-allowlist

      # Connection-budget ratchet (T16 / D4 / OV2 correction #10): fails if
      # a NEW `new Pool(...)` call site appears inside an exported
      # function/constructor without the codebase's lazy-singleton
      # memoization guard nearby — the per-call-pool failure mode that
      # pg-import-allowlist above can't see (it only checks WHETHER a file
      # imports 'pg', not HOW OFTEN it constructs a Pool). Complements, does
      # not replace, that check. See scripts/check-connection-budget.ts and
      # docs/ops/render-database-url.md for the audit this closed.
      - name: Connection-budget ratchet
        run: npm run ci:connection-budget

      - name: seam-registry check
        run: npm run ci:seam-registry

      # Content integrity + interactive-spec validity (2026-08-15 CP0).
      # Both gates exist because the failures they catch are INVISIBLE at
      # runtime: an interactive-spec that fails validation makes
      # InteractiveSidecar return null, so a broken widget is indistinguishable
      # from an atom that never had one (50 of 101 blocks were dead this way),
      # and a leaked generator header or an unmatched code fence just renders
      # as garbage at the bottom of a lesson. Neither shows up in typecheck or
      # unit tests, because both are prose problems in the content module.
      #
      # ci:interactive-specs imports the renderer's own validator rather than
      # a second copy, and additionally EVALUATES every manipulable formula
      # across its slider range and samples every simulation expression across
      # its t-range — so a spec that parses but divides by zero at an endpoint
      # fails here instead of in front of a student.
      - name: Content integrity (scaffolding leaks, fences, atom ids)
        run: npm run ci:content-integrity

      - name: Interactive-spec validity
        run: npm run ci:interactive-specs

      # Every concept's topic must resolve to an authoring template. The
      # lookup (template-loader.ts:114-122) returns null on a miss and
      # generation carries on un-guided, so a missing template produces atoms
      # written to no cadence at all and says nothing. 52 of 97 concepts were
      # in that state, hidden behind three near-miss topic_family names and
      # five topics with no template. Silent is the failure mode; this makes
      # it loud.
      - name: Template coverage (every concept topic has a cadence)
        run: npm run ci:template-coverage

      # A stance variant is a rewrite of already-verified content, so this
      # checks the parts a machine can check exactly and leaves the judge only
      # the question it cannot: does the prose still assert the same maths.
      # Interactive blocks byte-identical (except walkthroughs, where the
      # scaffolding may differ but every answer must survive in order),
      # struggling variants no longer than what they replace, no oversized
      # headings, and no construction repeating across a topic's concepts.
      - name: Variant agreement (stance variants vs their base atoms)
        run: npm run ci:variant-agreement

      # Journey card deck (M2 / D3.6). The plan's acceptance condition is
      # "every shipped card is QA-walked end to end; a card that dead-ends is
      # pulled, not shipped" — hand-walking that before every demo does not
      # survive a seven-day schedule, so the walk is encoded: persona resolves,
      # every atom exists, every interactive block in the rail parses, and the
      # rail's concept appears in the persona's mastery vector so a card cannot
      # claim "weak in linear algebra" over a fixture that is not.
      - name: Demo rails walkable
        run: npm run ci:demo-rails

      # Bare-Minimum Syllabus Contract (Track E3): reports concepts below
      # the declared floor. Exits 0 while ratchet=report_only; exits 1
      # (blocking) after the first floor-fill playbook completes.
      - name: Syllabus floor check
        run: npm run ci:syllabus-floor

      # Linear Algebra Complete Walkthrough (the "any and every concept"
      # guarantee, made mechanical): every one of the 26 linear-algebra
      # concepts must clear all 4 demo legs — explanation, interactive,
      # practice (>=5 gradable items), test (>=1 mapped PYQ). Blocking by
      # default; the test leg fails for all 26 concepts until the sibling
      # PYQ concept-mapping lane lands frontend/public/data/pyq-bank.json's
      # concept_ids/concept_id field — see scripts/check-la-walkthrough.ts's
      # header comment.
      - name: Linear Algebra walkthrough (4 legs × 26 concepts)
        run: npm run ci:la-walkthrough

      # Intent Catalogue gate (T3, design doc
      # docs/designs/2026-08-25-intent-driven-content-restructure.md §6):
      # validates data/curriculum/gate-em/atomic-catalogue.json (203 atoms —
      # unique ids, intent enum, question-inventory arithmetic, prerequisite
      # atoms resolve, concept_ids resolve, LA fully mapped, cross-DAG
      # prerequisite consistency) and intent-profiles.yml (four intents,
      # stage/atom_kind ∈ src/blueprints/types.ts enums, difficulty mixes,
      # module_profiles matches the catalogue's module set, error_tags ⊆
      # the locked ErrorTag union).
      #
      # The cross-DAG check (finding 9 from the design doc's review) found
      # 11 real prerequisite inversions in the workbook data against the
      # concept-graph teaching order (check A7). Those edges were repaired
      # in the catalogue in the same change that added this gate, so it
      # runs BLOCKING from day one — 12/12 checks green on committed data.
      - name: Intent catalogue + intent profiles validation
        run: npm run ci:intent-catalogue

      - name: Test
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npm test
