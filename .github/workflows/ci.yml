name: CI

# Wave 7 deliverable 6 — first CI workflow for this repo (no .github/
# directory existed before). Backend: Node 20 (matches package.json
# "engines" and the production Dockerfiles), npm ci, typecheck, test
# (exact script names confirmed from package.json's "scripts" block:
# "typecheck": "tsc --noEmit", "test": "vitest run"). Frontend: npm ci +
# `npx tsc --noEmit` directly, since frontend/package.json has no
# "typecheck" script of its own, plus `npm test` (frontend/vitest.config.ts
# + @testing-library are already wired — the repo has 40+ frontend test
# files under frontend/src/**/*.test.{ts,tsx}, so there's no reason to
# skip running them in CI). Frontend lint is intentionally NOT run here:
# both package.json "lint" scripts invoke eslint, but eslint isn't listed
# in either package's devDependencies, so `npm run lint` would fail on a
# clean install — that's a separate fix (add + configure eslint) from
# aligning CI to what's already working.
#
# U1-14 added a `lint:fork-test` step between typecheck and test: fails
# the build on a NEW literal exam-name string (GATE/BITSAT/JEE/NEET/CSIR/
# UGEE or their kebab-case exam-catalog ids) inside src/core, src/gbrain,
# src/readiness, or src/scoring — the engine dirs that must stay
# exam-agnostic per the Fork Test v2 architecture law. Pre-existing
# violations are frozen in scripts/fork-test-lint-baseline.json so this
# ratchets forward without blocking on debt this change didn't introduce;
# see scripts/fork-test-lint.mjs's header for the full rationale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fork-test lint (no exam-name literals in engine modules)
        run: npm run lint:fork-test

      # Content gate (realignment plan D4.2): atoms-dir/concept-id check,
      # retired-id grep, placeholder ratchet, golden-set answer keys.
      #
      # CONTENT_CI_STRICT flip rule (placeholder sequencing, spec-locked):
      # the 82 shipped placeholder explainers are grandfathered as the
      # ratchet baseline — CI fails only if the count INCREASES. After the
      # first real generation run lands, flip CONTENT_CI_STRICT to 'true'
      # IN THE SAME COMMIT that lands the real explainers.json; the gate
      # then requires zero placeholders. The gate is never permanently red
      # and --allow-placeholder never becomes routine.
      - name: Content gate (golden set + placeholder ratchet + atoms-dir)
        env:
          CONTENT_CI_STRICT: 'false'
        run: npm run ci:content-gate

      - name: Test
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npm test
