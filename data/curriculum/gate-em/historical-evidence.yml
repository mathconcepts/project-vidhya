# ---------------------------------------------------------------------------
# historical-evidence.yml — GATE Engineering Mathematics historical
# question-pattern evidence, imported per W1.2/E10 (D/P/S provenance codes).
#
# Source: "GATE Engineering Mathematics: Atomic Learning Objectives and
# Historical Question Patterns" (market-research corpus, imported
# 2026-08-27). That document reviewed the OFFICIAL GATE XE-A subject papers
# for 2021, 2022 and 2023 ONLY — three papers, one branch's XE-A section.
# Its own stated boundary (quoted verbatim, and binding on every consumer of
# this file):
#
#   "The historical field describes HOW TO PREPARE for question forms, not
#   how often a topic appears. It does not claim that a topic is asked every
#   year, has a fixed weightage, or will repeat."
#   "The first implementation should not hard-code a 'most important' or
#   'frequently asked' label from this appendix. Such labels require an
#   item-level historical corpus, a coding protocol, paper/year identifiers,
#   question IDs and a review process."
#
# In other words: `evidence: D` means "a directly reviewed example was
# visible in one of those three papers" — it is NOT a frequency, weightage,
# or "high-yield" claim, and must never be rendered as one. `ci:intent-catalogue`
# (check-intent-catalogue.ts's phrase-rule check) enforces the CI half of
# that discipline: student-facing copy may not say "high-yield" /
# "frequently asked" / "most repeated" / "often asked" without a structured
# `directly_reviewed` evidence label on the SPECIFIC item making the claim —
# this file's per-topic `evidence` values are D/P/S/S-tier corpus provenance
# for topic-level content planning, a related but distinct vocabulary from
# `evidence_level` on individual practice items and PYQ bank entries (D10:
# the two never read as rivals — see the header comment at
# src/scoring/learning-object-catalog-file.ts's AuthoredItem.evidence_level
# and frontend/public/data/pyq-bank.json's schema for that item-level field).
#
# Evidence codes (source's own definitions, quoted):
#   D — "A directly reviewed example or very close item was visible in an
#       official paper reviewed for this study."
#   P — "The pattern family is supported by multiple reviewed official-paper
#       forms, but the exact atomic item was not isolated in every paper."
#   S — "The pattern is a syllabus-derived preparation expectation requiring
#       further item-level coding."
#
# Resolution rule for the source's own combined "D/P" rows (7 of 116): the
# source's own D definition only requires that a directly-reviewed example
# "was visible" at least once, which every D/P row satisfies by construction
# (that is exactly what distinguishes a D/P row from a plain P row) — so
# combined rows resolve to `D`, never split or invented. Each resolved entry
# below carries an inline comment saying so, for anyone auditing this file
# against the source doc.
#
# 116 topic ids across 9 GATE EM sub-areas (LA/CA/VC/DE/PD/CX/PS/NM/DM —
# Linear Algebra, Calculus, Vector Calculus, Ordinary/Partial Differential
# Equations, Complex Variables, Probability & Statistics, Numerical Methods,
# Discrete Mathematics for CS). These ids are the CORPUS's own topic
# taxonomy — a DIFFERENT id scheme from atomic-catalogue.json's AT-### ids
# and from the concept graph's concept ids. No automatic join exists between
# them; an operator wiring this into content generation must map explicitly,
# not assume string equality.
#
# `pattern` is a short paraphrase of the source's "historical question
# pattern" column with the trailing evidence marker stripped (that marker is
# what became `evidence` below) — kept close to source wording rather than
# summarized further, so a reviewer can spot-check against the corpus doc by
# eye. `topic` is the corpus's own topic label, included for readability;
# it is not part of the {pattern, evidence} contract this file exists to
# provide and callers should not depend on its exact wording.
#
# Validated by scripts/check-intent-catalogue.ts (B7: every key matches
# ^[A-Z]{2,3}-\d{2}$, `evidence` is one of D/P/S, `pattern` is a non-empty
# string) — see loadHistoricalEvidence() there.
# ---------------------------------------------------------------------------
