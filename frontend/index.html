<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mobile-first viewport: prevent zoom on input focus (iOS), respect safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="description" content="Vidhya — cost-minimal adaptive learning engine" />
    <!-- PWA + mobile chrome -->
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vidhya" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Prevent iOS callout on long press -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Fonts are self-hosted via @fontsource, imported in src/main.tsx, so the
         app has no external font dependency. See that import for why. -->
    <title>Vidhya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
